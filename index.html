     have to find. Both names, both +, from an empty month on. */
  if(!notes.some(n => isHomework(n.name))) html += homeworkHtml(null);

  /* The way to see and rewrite the whole month at once, bottom left — the
     same thing, and the same wording, as the manual editor in Voca/Para. */
  html += '<div class="board-foot"><button class="btn btn-ghost"' +
    ' onclick="openBoardText()">Edit by txt manually</button></div>';
  stack.innerHTML = html;
}

/* A task is reworded by pressing it, the way the to-do list in Time is
   reworded — not by opening the note it lives in. */
let hwEditKey = null;

function hwStartEdit(noteId, idx){
  const key = noteId + '|' + idx;
  hwEditKey = (hwEditKey === key) ? null : key;
  renderBoard();
  const box = document.querySelector('#boardStack .todo-edit-input');
  if(box){ box.focus(); box.select(); }
}

/* Enter keeps it, Escape drops it, and tapping elsewhere keeps it too — on a
   phone that is how a box is left, and losing the wording there would be a
   nasty surprise. */
function hwRenameKey(ev, noteId, idx){
  if(ev.key === 'Enter'){ ev.preventDefault(); hwRenameCommit(ev.target, noteId, idx); return; }
  if(ev.key === 'Escape'){ ev.preventDefault(); hwEditKey = null; renderBoard(); }
}

async function hwRenameCommit(el, noteId, idx){
  if(hwEditKey === null) return;              // already closed by Escape
  hwEditKey = null;
  const note = notesOf(viewMonth).find(n => n.id === noteId);
  if(!note || !note.lines[idx]){ renderBoard(); return; }
  const text = String(el.value || '').trim();
  // Emptied, the task goes. There is no ✕ on these lines, so this is the only
  // way to be rid of one without opening the whole note.
  if(text) note.lines[idx].t = text;
  else note.lines.splice(idx, 1);
  renderBoard();
  saveBoard().catch(() => {});
}

async function toggleLine(noteId, idx){
  const note = notesOf(viewMonth).find(n => n.id === noteId);
  if(!note || !note.lines[idx]) return;
  note.lines[idx].done = !note.lines[idx].done;
  renderBoard();                 // the mark goes on before the save, never after
  saveBoard().catch(() => {});
}

/* A new task goes in under the heading it was added from, which is the line
   after that person's last one — not at the end of the note. */
async function addHomework(noteId, who){
  /* No note yet: the + is the thing that makes one, with both names in it,
     so the block the + was pressed in is the block that appears. */
  let note = noteId ? notesOf(viewMonth).find(n => n.id === noteId) : null;
  if(!note){
    const mm = viewMonth;
    if(!Array.isArray(board[mm])) board[mm] = [];
    note = {id: uid(), name: HW_NAME, color: '',
            lines: HW_WHO.map(w => ({s: false, t: w, done: false, due: ''}))};
    board[mm].push(note);
    noteId = note.id;
  }
  let at = note.lines.length, seen = !who;
  for(let i = 0; i < note.lines.length; i++){
    const l = note.lines[i];
    if(!l.s){
      if(seen){ at = i; break; }
      if(l.t === who) seen = true;
    }
  }
  note.lines.splice(at, 0, {s: true, t: '새 숙제', done: false, due: ''});
  /* Opened for rewording where it stands rather than in a box over the
     board — the same as every other list in these two panes. */
  hwEditKey = noteId + '|' + at;
  renderBoard();
  const edit = document.querySelector('#boardStack .todo-edit-input');
  if(edit){ edit.focus(); edit.select(); }
  saveBoard().catch(() => {});
}

/* ---- a task's deadline ------------------------------------------------
   A month at a time, stepped with the same arrows the board uses. Pressing a
   day sets it; pressing the day already set clears it, which is the only way
   back out and matches every other mark in these apps.
   ----------------------------------------------------------------------- */
let dueTarget = null;            // {noteId, idx}
let dueMonth = null;             // the month the picker is showing

function openDuePicker(noteId, idx){
  const note = notesOf(viewMonth).find(n => n.id === noteId);
  const line = note && note.lines[idx];
  if(!line) return;
  dueTarget = {noteId: noteId, idx: idx};
  dueMonth = line.due ? monthOf(line.due) : viewMonth;
  renderDuePicker();
  document.getElementById('dueOverlay').classList.add('show');
}

function hideDue(){
  document.getElementById('dueOverlay').classList.remove('show');
  dueTarget = null;
}

function stepDueMonth(delta){
  const y = 2000 + parseInt(dueMonth.slice(0,2), 10);
  const m = parseInt(dueMonth.slice(2,4), 10) - 1;
  dueMonth = ym(new Date(y, m + delta, 1));
  renderDuePicker();
}

function renderDuePicker(){
  if(!dueTarget) return;
  const note = notesOf(viewMonth).find(n => n.id === dueTarget.noteId);
  const line = note && note.lines[dueTarget.idx];
  if(!line) return;

  const y = 2000 + parseInt(dueMonth.slice(0,2), 10);
  const m = parseInt(dueMonth.slice(2,4), 10) - 1;
  const lead = dowIndex(new Date(y, m, 1));
  const days = new Date(y, m + 1, 0).getDate();
  const today = todayCode();

  let grid = DOW.map(d => '<span class="due-dow">' + d + '</span>').join('');
  for(let i = 0; i < lead; i++) grid += '<button class="off" tabindex="-1"></button>';
  for(let day = 1; day <= days; day++){
    const code = dueMonth + pad2(day);
    grid += '<button class="' + (code === line.due ? 'on' : '') +
      (code === today ? ' now' : '') + '"' +
      ' onclick="setDue(\'' + code + '\')">' + day + '</button>';
  }

  document.getElementById('dueBox').innerHTML =
    '<button class="modal-close" onclick="hideDue()" aria-label="Close">✕</button>' +
    '<p class="modal-title">' + escapeHtml(line.t) + '</p>' +
    '<div class="month-row" style="gap:var(--sp-3);">' +
      '<button class="step-btn" onclick="stepDueMonth(-1)" aria-label="Previous month">' +
        '<svg class="chev left" width="11" height="11" viewBox="0 0 24 24" aria-hidden="true">' +
        '<path d="M7 3.5 L18.5 12 L7 20.5" fill="none" stroke="currentColor" stroke-width="4.2"' +
        ' stroke-linecap="square" stroke-linejoin="miter"/></svg></button>' +
      '<span class="month-label" style="font-size:var(--fs-body);">' +
        y + '. ' + (m + 1) + '</span>' +
      '<button class="step-btn" onclick="stepDueMonth(1)" aria-label="Next month">' +
        '<svg class="chev" width="11" height="11" viewBox="0 0 24 24" aria-hidden="true">' +
        '<path d="M7 3.5 L18.5 12 L7 20.5" fill="none" stroke="currentColor" stroke-width="4.2"' +
        ' stroke-linecap="square" stroke-linejoin="miter"/></svg></button>' +
    '</div>' +
    '<div class="due-grid">' + grid + '</div>' +
    '<p class="hint" style="margin-top:var(--sp-3);">' +
      (line.due ? '정한 날을 다시 누르면 지웁니다.' : '마감날을 고르세요.') + '</p>';
}

async function setDue(code){
  if(!dueTarget) return;
  const note = notesOf(viewMonth).find(n => n.id === dueTarget.noteId);
  const line = note && note.lines[dueTarget.idx];
  if(!line) return;
  line.due = (line.due === code) ? '' : code;      // the same day again clears it
  hideDue();
  hwEditKey = null;
  renderAll();                                     // the calendar shows D-day too
  saveBoard().catch(() => {});
}

/* =========================================================================
   Editing

   A note is written on where it stands. Only the month as a whole still
   opens a box, because the names have to be in the text for it to say which
   lines belong to which note.
   ========================================================================= */
/* ---- writing on a note, where it stands -------------------------------
   A note used to open a box over the board to be written in. It is written on
   in place now: pressing it turns the paper into the text it holds, with its
   colour beside it, and pressing ✓ or anything else puts it back.
   ----------------------------------------------------------------------- */
let noteEditId = null;

function openNote(id){
  const note = notesOf(viewMonth).find(n => n.id === id);
  if(!note || isHomework(note.name)) return;
  noteEditId = id;
  renderBoard();
  const box = document.querySelector('#boardStack .pi-edit');
  if(box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
}

/* A new note appears straight away, already open to be written on. Left
   empty, it is taken away again when it closes. */
async function addNote(base){
  const mm = viewMonth;
  if(!Array.isArray(board[mm])) board[mm] = [];
  const note = {id: uid(), name: nextName(mm, base), color: '', lines: []};
  board[mm].push(note);
  openNote(note.id);
  saveBoard().catch(() => {});
}

/* Typed into, the note is kept as it is typed — but the board is NOT redrawn,
   or the caret would jump back to the start on every letter. */
async function noteTyping(el, id){
  const note = notesOf(viewMonth).find(n => n.id === id);
  if(!note) return;
  note.lines = parseLines(el.value);
  saveBoard().catch(() => {});
}

async function noteColorPick(el, id){
  const note = notesOf(viewMonth).find(n => n.id === id);
  if(!note) return;
  note.color = el.value.replace('#', '');
  const paper = el.closest('.pi');
  if(paper) paper.style.background = el.value;      // no redraw: the box is open
  saveBoard().catch(() => {});
}

/* Closing. A note with nothing written on it is taken away rather than left
   as a blank square nobody meant to make. */
async function closeNote(){
  const id = noteEditId;
  noteEditId = null;
  if(id){
    const mm = viewMonth;
    const at = (board[mm] || []).findIndex(n => n.id === id);
    if(at !== -1 && !board[mm][at].lines.length){
      board[mm].splice(at, 1);
      saveBoard().catch(() => {});
    }
  }
  renderBoard();
}

function noteEditKey(ev){
  if(ev.key === 'Escape'){ ev.preventDefault(); closeNote(); }
}

async function deleteNoteNow(el, id){
  if(!armed(el, '한 번 더 누르면 지웁니다')) return;
  const mm = viewMonth;
  const at = (board[mm] || []).findIndex(n => n.id === id);
  if(at === -1) return;
  board[mm].splice(at, 1);
  noteEditId = null;
  renderBoard();
  saveBoard().catch(() => {});
}

/* The month as a whole, as text — the one thing still written in a box,
   because without the [names] there is no saying which lines belong where. */
function openBoardText(){
  noteEditId = null;
  document.getElementById('noteBox').innerHTML =
    '<button class="modal-close" onclick="hideNote()" aria-label="Close">✕</button>' +
    '<p class="modal-title">' + escapeHtml(monthTitle()) + '</p>' +
    '<textarea id="noteText" rows="14" spellcheck="false"' +
      ' style="font-size:var(--fs-label);">' +
      escapeHtml(boardToEditText(viewMonth)) + '</textarea>' +
    '<p class="hint" style="margin-top:var(--sp-2);">' +
      '<code>-</code>로 시작하면 작은 줄. 포스트잇 색은 포스트잇을 눌러서 고칩니다.</p>' +
    '<div class="actions" style="margin-top:var(--sp-3);">' +
      '<button class="btn btn-primary" onclick="saveNoteText(this)">저장</button>' +
    '</div>';
  document.getElementById('noteOverlay').classList.add('show');
}

function monthTitle(){
  return (2000 + parseInt(viewMonth.slice(0,2), 10)) + '. ' + parseInt(viewMonth.slice(2,4), 10);
}

function hideNote(){ document.getElementById('noteOverlay').classList.remove('show'); }

/* Replacing a whole month asks twice. */
async function saveNoteText(el){
  const text = document.getElementById('noteText').value;
  const mm = viewMonth;
  if(!Array.isArray(board[mm])) board[mm] = [];
  if(board[mm].length && !armed(el, '한 번 더 누르면 이 달을 덮어씁니다')) return;
  // A month rewritten as text keeps the colours its notes already had.
  const old = {};
  board[mm].forEach(n => { old[n.name] = n.color; });
  const parsed = parseBoardText(text);
  parsed.forEach(n => { if(old[n.name]) n.color = old[n.name]; });
  board[mm] = parsed;
  hideNote(); renderBoard();
  saveBoard().catch(() => {});
}

/* The armed state: the first press underlines the text in red, the second
   acts. Never a dialog, and the wording is restored if nothing follows. */
const ARMED = new Map();
function armed(el, label){
  const now = Date.now();
  const prev = ARMED.get(el);
  if(prev && now - prev.at < 4000){
    clearTimeout(prev.timer);
    ARMED.delete(el);
    el.textContent = prev.original;
    el.classList.remove('is-armed');
    return true;
  }
  const original = prev ? prev.original : el.textContent;
  el.textContent = label;
  el.classList.add('is-armed');
  const timer = setTimeout(() => {
    el.textContent = original;
    el.classList.remove('is-armed');
    ARMED.delete(el);
  }, 4000);
  ARMED.set(el, {at: now, original: original, timer: timer});
  return false;
}

/* =========================================================================
   PANE 2 — the month

   The day is ticked in two places: the box at the top, which is today and is
   meant to be one tap, and the day editor, which is any day and is meant to be
   complete. Both write the same two keys.
   ========================================================================= */

/* The week a day belongs to, Monday first — this is what the two-a-week limit
   on eating out is counted against. */
/* ---- today, under the calendar, written straight into ------------------
   Not a summary of today with an editor behind it: this IS the editor. The
   same three lists the day popup draws, so today — the day actually being
   written — needs no popup at all. The popup stays for every other day.
   ----------------------------------------------------------------------- */
/* Which day the part above the calendar is showing. Today until a date is
   pressed; pressing today's date, or the heading, comes back. */
let pickedDay = null;
const shownDay = () => pickedDay || todayCode();

function renderToday(){
  const code = shownDay();
  const d = dateFromCode(code);
  const weekend = dowIndex(d) >= 5;
  const isToday = (code === todayCode());

  /* The tasks falling due today are not written into the day — they are
     worked out from the board, so moving a deadline moves them with it. */
  /* Through the same marks everything else here goes through: the wording
     shows, the link is a link, and no punctuation is left on screen. This
     line was being escaped raw, so a task written with a link read out its
     whole address. */
  const dues = duesOn(code).map(t =>
    '<div class="due-sched">' + mdToHtml(t) + '</div>').join('');

  document.getElementById('todayBox').innerHTML =
    '<button class="today-date" onclick="pickDay(null)">' +
      (isToday ? '오늘 &middot; ' : '') + (d.getMonth()+1) + '. ' + d.getDate() +
      ' (' + DOW[dowIndex(d)] + ')' +
      (isToday ? '' : '<span class="back-today">오늘로</span>') +
    '</button>' +
    /* The day's own errands first and the deadlines under them: what was
       written for today outranks what merely falls due on it. Both inside the
       one group, so the + closes the pair rather than splitting it. */
    dayListHtml(code, 'sched', dues) +
    (weekend ? '' : checksHtml(code)) +
    dayListHtml(code, 'chal') +
    dayListHtml(code, 'diary');
}

/* Pressing a date moves the part above the calendar onto it; there is no
   popup any more, so the day is written in the one place. */
function pickDay(code){
  pickedDay = (code && code !== todayCode()) ? code : null;
  dayEditKey = null;
  renderCalPane();
}

/* ---- the month grid --------------------------------------------------- */
function renderCalendar(){
  const mm = viewMonth;
  const y = 2000 + parseInt(mm.slice(0,2), 10);
  const m = parseInt(mm.slice(2,4), 10) - 1;
  const first = new Date(y, m, 1);
  const lead = dowIndex(first);
  const days = new Date(y, m + 1, 0).getDate();
  const today = todayCode();

  let html = DOW.map(d => '<div class="cal-dow">' + d + '</div>').join('') +
    '<div class="cal-dow"></div>';
  for(let i = 0; i < lead; i++) html += '<div class="cal-cell empty"></div>';

  /* The eighth column belongs to the week, not to a day, so it is written
     whenever the row is full — and once more at the end for a month that
     stops partway through a week. */
  let col = lead;
  const weekCell = code => {
    const k = weekKey(code);
    const t = talkOf(k);
    return '<button class="cal-week" onclick="openTalk(\'' + k + '\')"' +
      ' aria-label="쀼톡">' +
      (talkEmpty(t) ? PLUS_SVG : '<span class="mark">REVIEW</span>') +
      '</button>';
  };

  for(let day = 1; day <= days; day++){
    const code = mm + pad2(day);
    const d = new Date(y, m, day);
    const weekend = dowIndex(d) >= 5;
    const s = sharedOf(code);

    /* No ticks on a weekend: there is nothing to record, so nothing is drawn
       rather than two empty boxes that can never be filled. */
    let marks = '';
    if(!weekend){
      marks = '<div class="cal-marks">' +
        DAY_MARKS.map(m =>
          '<span class="cal-sq"' +
            (markDone(s, m.key)
              ? ' style="background:#' + escapeAttr(markColor(m.key)) +
                ';border-color:#' + escapeAttr(markColor(m.key)) + ';"'
              : '') + '></span>').join('') +
        '</div>';
    }



    /* The errands are written out; the diary is not — it is a paragraph, and
       a cell this narrow would show four characters of it. So the diary keeps
       the dot that says there is some, and the day opens to show it.

       Two lines for the wording, and what was written FOR the day comes
       first: a deadline falls on a day, an errand was put there. Both sit in
       the one two-line box, so the deadlines take whatever room the errands
       leave and simply do not appear when there is none. */
    const join = arr => escapeHtml(arr.map(stripMd).join(' / '));
    const dues = duesOn(code);
    let sched = '';
    if(s.sched.length || dues.length){
      sched = '<span class="cal-sched">' +
        (s.sched.length ? '<span>' + join(s.sched) + '</span>' : '') +
        (dues.length ? '<span class="due">' +
          (s.sched.length ? ' / ' : '') + join(dues) + '</span>' : '') +
      '</span>';
    }
    if(s.chal.length) sched += '<span class="cal-sched chal">' + join(s.chal) + '</span>';
    const written = s.diary.length ? '<span class="cal-dot"></span>' : '';

    html += '<button class="cal-cell' + (weekend ? ' weekend' : '') +
              (code === today ? ' today' : '') +
              (code === shownDay() && code !== today ? ' picked' : '') + '"' +
              ' onclick="pickDay(\'' + code + '\')">' +
              '<span class="cal-daynum">' + day + '</span>' +
              sched + marks + written +
            '</button>';

    col++;
    if(col === 7){ html += weekCell(code); col = 0; }
  }
  /* A month that ends mid-week still has that week, and it still gets its
     column: the blanks go first so the mark stays in the last place. */
  if(col > 0){
    for(let i = col; i < 7; i++) html += '<div class="cal-cell empty"></div>';
    html += weekCell(mm + pad2(days));
  }
  document.getElementById('calGrid').innerHTML = html;
}

function renderCalPane(){ renderToday(); renderCalendar(); }

/* ---- the day ----------------------------------------------------------
   Three lists and two ticks. Each list is added to by a +, and each line is
   reworded by pressing it, which is how the homework on the board and the
   to-do list in Time both behave. An emptied line is a deleted line.
   ----------------------------------------------------------------------- */
let dayCode = null;
/* Which line is open for rewording, named by its DAY as well as its list and
   its place in it. Today's list and the popup can both be on screen, and a
   key that said only 'sched|2' would open the same line in both. */
let dayEditKey = null;

const DAY_LISTS = {
  sched: {label: '스케줄', add: '새 일정'},
  chal:  {label: '도전',   add: '새 도전'},
  diary: {label: '일기',   add: '오늘 한 줄'}
};

/* Output, then input or exercise. Drawn the same under the calendar and in
   the popup, and never on a weekend — those days are off by agreement, so
   there is nothing to tick and nothing is drawn. */
/* Three lines, each a name and a blank. Nothing is ticked: what is written
   in the blank is the record — "수영" one day and "조깅" the next — and a
   blank left empty is a day it did not happen. */
function checksHtml(code){
  const s = sharedOf(code);
  return '<div class="hw-group mark-group">' +
    DAY_MARKS.map(m =>
      '<div class="mark-row">' +
        '<span class="mark-label">' + m.label + '</span>' +
        '<span class="mark-colon">:</span>' +
        '<input type="text" class="mark-input" value="' + escapeAttr(s[m.key]) + '"' +
          ' onchange="setMark(\'' + code + '\',\'' + m.key + '\',this.value)"' +
          ' aria-label="' + m.label + '">' +
      '</div>').join('') +
  '</div>';
}

async function setMark(code, key, value){
  const s = sharedOf(code);
  s[key] = String(value || '').trim();
  shared[code] = s;
  renderCalendar();            // the grid's marks follow, the box is untouched
  saveShared().catch(() => {});
}

/* One list of a day: its lines, each reworded by pressing it and deleted by
   emptying it, and a + at the right that adds one more. The same markup is
   used under the calendar and inside the popup. */
/* One list of the day. Nothing names them: they are told apart by where they
   stand and by the one that is red. The label is kept for the + button's
   spoken name.

   The diary is the odd one: it is not a list of things but a few lines of
   writing, so it holds one entry and the + goes away once it has it. */
function dayListHtml(code, field, tail){
  const s = sharedOf(code);
  const meta = DAY_LISTS[field];
  const red = (field === 'chal');
  const prose = (field === 'diary');
  const rows = prose ? (s.diary.length ? [s.diary.join('\n')] : []) : s[field];

  return '<div class="hw-group' + (prose ? ' diary-group' : '') + '">' +
    rows.map((t, i) => {
      const key = code + '|' + field + '|' + i;
      const args = '\'' + code + '\',\'' + field + '\',' + i;
      if(dayEditKey === key){
        return '<div class="todo-row">' + (prose
          ? '<textarea class="todo-edit-input prose" rows="3"' +
              ' onkeydown="dayLineKey(event,' + args + ')"' +
              ' onblur="dayLineCommit(this,' + args + ')"' +
              ' aria-label="고쳐 쓰기">' + escapeHtml(t) + '</textarea>'
          : '<input type="text" class="todo-edit-input" value="' + escapeAttr(t) + '"' +
              ' onkeydown="dayLineKey(event,' + args + ')"' +
              ' onblur="dayLineCommit(this,' + args + ')"' +
              ' aria-label="고쳐 쓰기">') + '</div>';
      }
      return '<div class="todo-row">' +
        '<button class="todo-text"' + (red ? ' style="color:var(--rust);"' : '') +
          ' onclick="dayStartEdit(' + args + ')">' + mdToHtml(t) + '</button>' +
      '</div>';
    }).join('') +
    /* Anything that belongs to this list without being one of its lines —
       the deadlines under the errands — stands here, inside the group and
       above its +, or the + reads as belonging to whatever comes next. */
    (tail || '') +
    /* Prose gets one + and then none: there is one piece of writing a day,
       not a list of them. */
    (prose && rows.length ? '' :
      '<div class="hw-row"><button class="hw-add" aria-label="' + meta.label + ' 추가"' +
        (red ? ' style="color:var(--rust);"' : '') +
        ' onclick="addDayLine(\'' + code + '\',\'' + field + '\')">' + PLUS_SVG + '</button></div>') +
  '</div>';
}

/* Today may be on screen while another day is being written, so both the
   part above the calendar and the grid are redrawn together. */
function redrawDay(code){ renderCalPane(); }

function focusDayEdit(){
  const box = document.querySelector('#todayBox .todo-edit-input');
  if(box){ box.focus(); box.select(); }
}

async function addDayLine(code, field){
  const s = sharedOf(code);
  s[field].push(DAY_LISTS[field].add);
  shared[code] = s;
  /* Opened for rewording straight away: a line that reads "새 일정" is a
     placeholder, and asking for a second tap to replace it would be a step
     with nothing in it. */
  dayEditKey = code + '|' + field + '|' + (s[field].length - 1);
  redrawDay(code);
  focusDayEdit();
  saveShared().catch(() => {});
}

function dayStartEdit(code, field, idx){
  const key = code + '|' + field + '|' + idx;
  dayEditKey = (dayEditKey === key) ? null : key;
  redrawDay(code);
  focusDayEdit();
}

/* Enter keeps it, Escape drops it, and tapping elsewhere keeps it too — on a
   phone that is how a box is left, and losing the wording there would be a
   nasty surprise. */
function dayLineKey(ev, code, field, idx){
  /* In prose, Enter is a new line; it is only "done" in a one-line field. */
  if(ev.key === 'Enter' && field !== 'diary'){
    ev.preventDefault(); dayLineCommit(ev.target, code, field, idx); return;
  }
  if(ev.key === 'Escape'){ ev.preventDefault(); dayEditKey = null; redrawDay(code); }
}

async function dayLineCommit(el, code, field, idx){
  const s = sharedOf(code);
  if(!s[field].length) return;
  const t = String(el.value || '').trim();
  if(field === 'diary'){
    /* Prose: the whole of it is one entry, kept as the lines it was written
       in so the text form stays line by line. */
    s.diary = t ? t.split('\n').map(x => x.trim()).filter(Boolean) : [];
  } else if(t) s[field][idx] = t;
  else s[field].splice(idx, 1);     // emptied out, the line goes with it
  shared[code] = s;
  dayEditKey = null;
  redrawDay(code);
  saveShared().catch(() => {});
}

/* ---- 쀼톡, one per week ------------------------------------------------
   Written as text, in the same three headings every week, so a blank one is
   the headings with nothing under them.
   ----------------------------------------------------------------------- */
const TALK_SECTIONS = [
  {key: 'good',   head: '좋았던 점'},
  {key: 'better', head: '나아지면 좋은점'},
  {key: 'etc',    head: '기타'}
];
const TALK_BLANK = TALK_SECTIONS.map(s => '[' + s.head + ']\n').join('\n');

function talkToText(t){
  return TALK_SECTIONS.map(s =>
    '[' + s.head + ']\n' + t[s.key].join('\n')).join('\n\n');
}

function parseTalkText(text){
  const out = {good: [], better: [], etc: []};
  let cur = null;
  String(text).split('\n').forEach(raw => {
    const line = raw.trim();
    if(!line) return;
    const m = line.match(/^\[(.+)\]$/);
    if(m){
      const hit = TALK_SECTIONS.find(s => s.head === m[1].trim());
      cur = hit ? hit.key : null;
      return;
    }
    if(cur) out[cur].push(line);
  });
  return out;
}

/* The week it covers, said as the two dates it runs between. */
function talkTitle(key){
  const a = dateFromCode(key);
  const b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 6);
  return (a.getMonth()+1) + '. ' + a.getDate() + ' – ' + (b.getMonth()+1) + '. ' + b.getDate();
}

let talkKey = null;

/* Read first, written second. A week already written is there to be read,
   and opening onto an editing box made the headings and the marks the first
   thing seen instead of what the two of them actually said. Pressing it opens
   the full text, headings and all. A week with nothing in it has nothing to
   read, so it opens ready to write. */
let talkEditing = false;

function openTalk(key){
  talkKey = key;
  talkEditing = talkEmpty(talkOf(key));
  renderTalk();
  document.getElementById('talkOverlay').classList.add('show');
}

function renderTalk(){
  const t = talkOf(talkKey);
  const empty = talkEmpty(t);
  document.getElementById('talkBox').innerHTML =
    '<button class="modal-close" onclick="hideTalk()" aria-label="Close">✕</button>' +
    '<p class="modal-title">쀼톡 &middot; ' + talkTitle(talkKey) + '</p>' +
    (talkEditing
      ? '<textarea id="talkText" rows="14" spellcheck="false"' +
          ' style="font-size:var(--fs-label);">' +
          escapeHtml(empty ? TALK_BLANK : talkToText(t)) + '</textarea>' +
        '<div class="actions" style="margin-top:var(--sp-3);">' +
          '<button class="btn btn-primary" onclick="saveTalk()">저장</button>' +
          (empty ? '' : '<button class="btn btn-danger" onclick="deleteTalk(this)">삭제</button>') +
        '</div>'
      : '<button class="talk-read" onclick="editTalk()">' +
          TALK_SECTIONS.filter(s => t[s.key].length).map(s =>
            '<span class="talk-part">' +
              t[s.key].map(x => '<span>' + mdToHtml(x) + '</span>').join('<br>') +
            '</span>').join('') +
        '</button>');
  if(talkEditing){
    const box = document.getElementById('talkText');
    if(box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }
}

function editTalk(){ talkEditing = true; renderTalk(); }

function hideTalk(){
  document.getElementById('talkOverlay').classList.remove('show');
  talkEditing = false;
}

async function saveTalk(){
  if(!talkKey) return;
  const t = parseTalkText(document.getElementById('talkText').value);
  /* Nothing under any heading is nothing at all: the week goes back to a +
     rather than being kept as an empty record. */
  if(talkEmpty(t)) delete talks[talkKey];
  else talks[talkKey] = t;
  hideTalk();
  renderCalPane();
  saveTalks().catch(() => {});
}

async function deleteTalk(el){
  if(!talkKey) return;
  if(!armed(el, '한 번 더 누르면 지웁니다')) return;
  delete talks[talkKey];
  hideTalk();
  renderCalPane();
  saveTalks().catch(() => {});
}

/* =========================================================================
   Options
   ========================================================================= */
/* ---- the data editor -------------------------------------------------
   The same text the backup holds, narrowed by kind and by date, and written
   back the same way: whatever the text names is replaced, whatever it leaves
   out is left alone.
   ----------------------------------------------------------------------- */
let dataKinds = {review: true, talk: true, day: true};

function toggleKind(el, key){
  dataKinds[key] = !dataKinds[key];
  el.classList.toggle('on', dataKinds[key]);
  renderDataText();
}

/* The date boxes speak 2026-10-26; the data is keyed 261026. */
const fromISO = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v.slice(2).replace(/-/g, '') : '';

function dataRange(){
  return {
    from: fromISO(document.getElementById('dataFrom').value),
    to:   fromISO(document.getElementById('dataTo').value)
  };
}

function clearDataRange(){
  document.getElementById('dataFrom').value = '';
  document.getElementById('dataTo').value = '';
  renderDataText();
}

function renderDataText(){
  const r = dataRange();
  const text = allToFullText(dataKinds, r.from, r.to);
  document.getElementById('dataText').value = text;
  document.getElementById('dataMsg').textContent =
    text ? '' : '고른 조건에 해당하는 내용이 없습니다.';
}

function copyDataText(){
  const el = document.getElementById('dataText');
  el.select();
  try{ navigator.clipboard.writeText(el.value); }catch(e){ document.execCommand('copy'); }
  document.getElementById('dataMsg').textContent = '복사했습니다.';
}

async function applyDataText(el){
  const p = parseAllText(document.getElementById('dataText').value);
  const c = restoreCounts(p);
  if(!restoreHasAny(p)){
    document.getElementById('dataMsg').textContent = '되돌릴 내용이 없습니다.';
    return;
  }
  if(!armed(el, '한 번 더 누르면 덮어씁니다')) return;
  const jobs = applyParsed(p);
  renderAll();
  /* After the redraw, not before: renderDataText clears this line. */
  renderDataText();
  document.getElementById('dataMsg').textContent =
    Object.keys(c).map(k => k + ' ' + c[k]).join(' · ') + ' 되돌렸습니다.';
  Promise.all(jobs).catch(() => {});
}

function renderOptions(){
  document.getElementById('nameA').value = people.a || '';
  document.getElementById('nameB').value = people.b || '';
  document.getElementById('meRow').innerHTML = WHO.map(who =>
    '<button class="opt-btn' + (me === who ? ' selected' : '') + '"' +
    ' onclick="setMe(\'' + who + '\')">' + escapeHtml(people[who]) + '</button>').join('');
  document.getElementById('syncIdInput').value = getSyncId();
  renderColorRows();
  renderDataText();
}

/* Changing one is instant — there is nothing to confirm about a colour, and
   seeing it is the only way to judge it. */
function renderColorRows(){
  document.getElementById('colorRows').innerHTML = COLOR_SLOTS.map(s =>
    '<div class="color-line">' +
      '<input type="color" value="#' + escapeAttr(colorSlot(s.key)) + '"' +
        ' aria-label="' + escapeAttr(s.label) + '"' +
        ' oninput="setColorSlot(' + JSON.stringify(s.key).replace(/"/g, '&quot;') +
        ', this.value)">' +
      '<span>' + escapeHtml(s.label) + '</span>' +
    '</div>').join('');
}

async function setColorSlot(key, value){
  colors[key] = String(value || '').replace('#', '').toUpperCase();
  renderAll();
  renderDataText();
  saveColors().catch(() => {});
}

async function resetColors(el){
  if(!armed(el, '한 번 더 누르면 되돌립니다')) return;
  colors = Object.assign({}, DEFAULT_COLORS);
  renderColorRows();
  renderAll();
  renderDataText();
  saveColors().catch(() => {});
}

async function saveNames(){
  people = {a: document.getElementById('nameA').value.trim() || '령',
            b: document.getElementById('nameB').value.trim() || '동'};
  renderOptions(); renderAll();
  savePeople().catch(() => {});
}

function setMe(who){
  me = who;
  try{ localStorage.setItem(ME_KEY, who); }catch(e){}
  renderOptions();
}

function copySyncId(){
  const el = document.getElementById('syncIdInput');
  el.select();
  try{ navigator.clipboard.writeText(el.value); }catch(e){ document.execCommand('copy'); }
  document.getElementById('syncMsg').textContent = '복사했습니다.';
}

/* Changing the code points this device at someone else's data, so it asks
   twice and then reloads rather than trying to reconcile what is in memory. */
async function applySyncId(el){
  const v = document.getElementById('syncIdInput').value.trim();
  if(!v) return;
  if(v === getSyncId()){ document.getElementById('syncMsg').textContent = '이미 이 코드입니다.'; return; }
  if(!armed(el, '한 번 더 누르면 바뀝니다')) return;
  setSyncId(v);
  document.getElementById('syncMsg').textContent = '코드를 바꿨습니다. 다시 불러옵니다…';
  setTimeout(() => location.reload(), 400);
}

/* =========================================================================
   Backup — every key this app owns, in one text file. A new field goes in
   here in the same change that creates it; that rule is why nothing has been
   lost across the other two apps.
   ========================================================================= */
function buildBackupText(){
  return '===== BBYU ' + todayCode() + ' =====\n\n' +
    colorsToFullText() + '\n\n\n' +
    peopleToFullText() + '\n\n\n' + allToFullText();
}

function downloadText(name, text){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function backupAll(){
  downloadText('BBYU_' + todayCode() + '.txt', buildBackupText());
  document.getElementById('backupMsg').textContent = '백업을 받았습니다.';
}

let pendingRestore = null;

function openRestorePicker(){ document.getElementById('restoreFile').click(); }

function handleRestoreFile(input){
  const file = input.files && input.files[0];
  input.value = '';                     // so the same file can be picked again
  if(!file) return;
  const r = new FileReader();
  r.onload = () => { pendingRestore = readBackupText(String(r.result || '')); showRestore(file.name); };
  r.onerror = () => { pendingRestore = null; showRestore(file.name, '읽을 수 없는 파일입니다.'); };
  r.readAsText(file);
}

/* A kind the file does not mention comes back empty, and empty is what stops
   that part being touched: half a file must not be able to wipe what it does
   not mention. The file's own date line decides which year a month written as
   "10월" belongs to. */
function readBackupText(text){
  const s = String(text || '');
  const stamp = /=====\s*BBYU\s*(\d{6})/.exec(s);
  const out = parseAllText(s, stamp ? stamp[1].slice(0,2) : null);
  return restoreHasAny(out) ? out : readLegacyBackup(s);
}

/* Files taken before the backup became readable text: one `key<TAB>{json}`
   line per store. They are still restorable — a backup that stops working
   because the format moved on is not a backup. */
function readLegacyBackup(text){
  const raw = {};
  String(text).split('\n').forEach(line => {
    const i = line.indexOf('\t');
    if(i === -1) return;
    try{ raw[line.slice(0, i).trim()] = JSON.parse(line.slice(i + 1)); }catch(e){}
  });
  const out = {colors: raw['colors'] || null, people: raw['people'] || null,
               board: raw['board'] || {}, talks: raw['talks'] || {},
               shared: raw['shared'] || {}};
  /* Older still: the day was two records, one per person. */
  if(raw['daily-a'] || raw['daily-b']){
    const keep = shared;
    shared = Object.assign({}, out.shared);
    migrateDays(raw['daily-a'] || {}, raw['daily-b'] || {});
    out.shared = shared;
    shared = keep;
  }
  return out;
}

function restoreCounts(p){
  if(!p) return null;
  return {
    '쀼리뷰': Object.keys(p.board || {}).length,
    '쀼톡':   Object.keys(p.talks || {}).length,
    '쀼일':   Object.keys(p.shared || {}).length
  };
}
function restoreHasAny(p){
  const c = restoreCounts(p);
  return !!(p && (p.colors || p.people || (c['쀼리뷰'] + c['쀼톡'] + c['쀼일']) > 0));
}

function showRestore(name, err){
  const wrap = document.getElementById('restoreWrap');
  const msg = document.getElementById('restoreMsg');
  const go = document.getElementById('restoreGoBtn');
  wrap.style.display = 'block';
  if(err || !restoreHasAny(pendingRestore)){
    pendingRestore = null;
    msg.textContent = name + ' — ' + (err || '읽을 내용이 없습니다.');
    go.style.display = 'none';
    return;
  }
  const c = restoreCounts(pendingRestore);
  msg.textContent = name + ' — ' +
    Object.keys(c).map(k => k + ' ' + (c[k] || '그대로')).join(' · ');
  go.style.display = '';
}

/* Each month, week and day the text names replaces the one stored under that
   name; everything it does not name is left alone. */
function applyParsed(p){
  const jobs = [];
  if(p.colors){ colors = Object.assign({}, colors, p.colors); jobs.push(saveColors()); }
  if(p.people){ people = Object.assign({}, people, p.people); jobs.push(savePeople()); }
  if(Object.keys(p.board).length){
    Object.keys(p.board).forEach(mm => {
      /* A month written back keeps the colours its notes already had, the way
         the month editor does. */
      const old = {};
      notesOf(mm).forEach(n => { old[n.name] = n.color; });
      p.board[mm].forEach(n => { if(!n.color && old[n.name]) n.color = old[n.name]; });
      board[mm] = p.board[mm];
    });
    jobs.push(saveBoard());
  }
  if(Object.keys(p.talks).length){
    Object.keys(p.talks).forEach(k => {
      if(talkEmpty(talkOf(k)) && talkEmpty(p.talks[k])) delete talks[k];
      else talks[k] = p.talks[k];
    });
    jobs.push(saveTalks());
  }
  if(Object.keys(p.shared).length){
    Object.keys(p.shared).forEach(c => { shared[c] = normDay(p.shared[c]); });
    jobs.push(saveShared());
  }
  return jobs;
}

function cancelRestore(){
  pendingRestore = null;
  document.getElementById('restoreWrap').style.display = 'none';
}

async function restoreFromFile(el){
  if(!pendingRestore) return;
  if(!armed(el, '한 번 더 누르면 덮어씁니다')) return;
  const jobs = applyParsed(pendingRestore);
  pendingRestore = null;
  document.getElementById('restoreWrap').style.display = 'none';
  document.getElementById('backupMsg').textContent = '복원했습니다.';
  renderAll(); renderOptions();
  Promise.all(jobs).catch(() => {});
}

/* =========================================================================
   Start
   ========================================================================= */
function renderAll(){
  renderMonthLabel();
  renderBoard();
  renderCalPane();
}

/* The date turning over while the app is open moves "today". */
let lastSeen = todayCode();
setInterval(() => {
  const now = todayCode();
  if(now === lastSeen) return;
  lastSeen = now;
  renderCalPane();
}, 30000);

document.querySelectorAll('.modal-overlay').forEach(ov => {
  ov.addEventListener('click', e => { if(e.target === ov) ov.classList.remove('show'); });
});

viewMonth = thisMonth();
/* Which screen this is, said once at the start, so the dot for it is lit
   before anything has been pressed. */
setPane(pane);
/* Drawn at once, before anything is fetched. The month, the empty board and
   today's row are all it can show yet, but the screen is never blank while a
   request is in flight — which is what it was doing: `renderAll` sat inside
   the load's `.then()`, so a slow or stalled read left nothing on screen until
   something else happened to redraw. Pressing a month arrow was that something
   else, which is why the board appeared the moment one was pressed. */
renderAll();
loadAll()
  .catch(e => { console.warn('Load failed, showing what is on this device', e); })
  .then(() => {
    renderAll();
    reportSyncTrouble();
    retryUnsent();
  });
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBYU</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%23111"/><text x="32" y="44" fill="%23fff" font-family="Helvetica,Arial" font-size="30" text-anchor="middle">BB</text></svg>'>
<link rel="apple-touch-icon" href="icon-bbyu-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  /* ======================================================================
     BBYU — the couple's board and month.

     Every token below is lifted from index.html / time.html unchanged. The
     only size this file adds is --fs-cell, which already exists in time.html
     under the same name for the same job: the figures in a narrow grid cell.
     ====================================================================== */
  :root{
    --font-ui:'Switzer','Pretendard Variable','Pretendard',
              'Helvetica Neue',Helvetica,Arial,
              'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    /* This app is dark. The two border weights DESIGN names are roles, not
       values — Layer A is still "the emphatic one", it is simply white here
       instead of black. Everything below reads these names rather than a
       literal, so the whole app inverts from one place. */
    --paper:#111111;                  /* the page */
    --ink:#FFFFFF;                    /* what is written on it */
    --paper-line:#2E2E2E;
    --rust:#FF4602;
    --rate-0:#00E5FF;
    --rate-1:#2CE17A;
    --rate-2:#F2FF00;
    --rate-3:#FF4602;
    /* Readable on the black page. A note is light paper, so it takes the
       app's own blue back — one name, two contexts, the same trick the popup
       uses for its whole palette. */
    --link-blue:#7FB2FF;
    /* The paper a note is on when it has not been given a colour of its own.
       The one value this file adds: nothing else in the three apps fills a box
       with a light grey, so there was nothing to reuse. */
    --postit:#EDEDED;
    /* How wide a note draws. Two fit across a phone held wide, one across it
       held tall, and the row wraps on its own either way. */
    --pi-w:288px;
    --text-dark:#FFFFFF;
    /* Lifted from #6B6B6B: that grey is quiet on white and almost unreadable
       on black, and a muted colour has to stay legible to be muted. */
    --text-muted:#9A9A9A;
    /* Layer B — the one grey that reads as a quiet edge on either background,
       which is why it alone did not have to move. */
    --line-b:#6B6B6B;
    --grid-line-strong:rgba(0,0,0,0.5);

    --sp-1:4px;  --sp-2:8px;  --sp-3:12px; --sp-4:16px;
    --sp-5:24px; --sp-6:32px; --sp-7:48px;
    --gap-block:24px;
    --gap-top:16px;

    /* The same four steps, same values. */
    --fs-display:clamp(38px, 12vw, 50px);
    --fs-lead:30px;
    --fs-body:22px;
    --fs-label:16px;
    /* time.html's fifth step, for figures inside a narrow cell. */
    --fs-cell:13px;

    --content-w:998px;
    --vw:100vw;
  }

  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--text-dark);
    font-family:var(--font-ui);
    font-weight:400;
    font-size:var(--fs-body);
    line-height:1.3;
    -webkit-text-size-adjust:100%;
    padding:var(--gap-top) var(--sp-4) var(--sp-7);
  }
  .wrap{max-width:var(--content-w); margin:0 auto;}

  /* ---- the sync banner, word for word the one the other two apps show ---- */
  #cloudBanner{
    display:none;
    margin:0 0 var(--sp-4);
    padding:var(--sp-3) var(--sp-4);
    background:var(--rust);
    color:var(--ink);
    font-size:var(--fs-label);
    text-align:center;
  }

  /* ---- header ----
     The two panes are switched by swiping, so there is nothing here to press
     for them. What remains is the month, and the way into Options. */
  .pane-btn{
    font-family:var(--font-ui); font-size:var(--fs-body); font-weight:400;
    background:none; border:none; border-radius:0; padding:0;
    color:var(--text-muted); cursor:pointer;
  }
  .pane-btn.on{color:var(--ink); font-weight:500;}
  .month-row .spacer{flex:1;}
  .month-nav{display:flex; align-items:center; gap:var(--sp-3);}

  /* Which of the two screens this is, and the way to the other one on a
     machine with no touch. These sat absolutely centred on the screen and
     landed on top of the month, which is wide: "2026. 10" with an arrow on
     either side reaches the middle of a phone. So they stand in the row with
     everything else, in the space between the month and 설정. */
  .pane-dots{
    display:flex; align-items:center; gap:var(--sp-2);
    flex:0 0 auto;
  }
  .pane-dots button{
    width:18px; height:18px; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; cursor:pointer; line-height:0;
  }
  /* The one round shape in this family of apps, and the only thing allowed to
     be round: a dot that is not a circle is not a dot. */
  .pane-dots i{
    display:block; width:6px; height:6px; border-radius:50%;
    background:var(--text-muted);
  }
  .pane-dots button.on i{background:var(--ink);}

  /* ---- the month stepper, shared by both panes ---- */
  .month-row{
    display:flex; align-items:center; gap:var(--sp-3);
    margin-bottom:var(--gap-block);
  }
  .month-label{font-size:var(--fs-lead); font-weight:500;}
  .step-btn{
    width:24px; height:24px; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; border-radius:0;
    color:var(--ink); cursor:pointer; line-height:0;
  }
  .step-btn:disabled{opacity:0.22; cursor:not-allowed;}
  /* The one chevron both other files draw, turned. */
  .chev{display:inline-block;}
  .chev.left{transform:scaleX(-1);}

  /* Word for word index.html's: 16px, weight 300, the page's own colour —
     not muted — and 6px under it. */
  .field-label{
    display:block;
    font-family:var(--font-ui); font-weight:300; font-size:var(--fs-label);
    color:var(--text-dark);
    margin-bottom:6px;
  }
  .hint{font-family:var(--font-ui); font-weight:300; font-size:var(--fs-label); color:var(--text-muted); margin:0;}

  .btn{
    font-family:var(--font-ui); font-size:var(--fs-label); font-weight:400;
    letter-spacing:0.01em;
    border:none; border-radius:0;
    padding:var(--sp-1) var(--sp-4);
    cursor:pointer;
    transition:opacity .15s, background .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:transparent; color:var(--ink); border:1px solid var(--ink);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--ink);}
  .btn-primary:hover, .btn-ghost:hover{background:rgba(255,255,255,0.08);}
  .btn-danger{background:transparent; color:var(--rust); border:none; padding:6px 10px; font-size:var(--fs-label);}
  /* The armed state of a two-press action: a red dotted rule under the text
     only, never under the whole box. */
  .is-armed{
    background-image:linear-gradient(to right, var(--rust) 0 100%);
    background-repeat:no-repeat;
    background-size:100% 1px;
    background-position:0 100%;
    background-origin:content-box;
    background-clip:content-box;
  }
  .actions{display:flex; gap:var(--sp-2); flex-wrap:wrap; align-items:center;}

  input[type="text"], textarea{
    font-family:var(--font-ui); font-size:var(--fs-body); color:var(--ink);
    background:transparent;
    border:0.5px solid var(--ink); border-radius:0;
    padding:var(--sp-1) var(--sp-4);
    width:100%;
  }
  textarea{line-height:1.3; resize:vertical;}

  /* ======================================================================
     PANE 1 — the board

     No headings. The top note is the 쀼훈, the ones under it are the agenda,
     and the size of the lettering is what says which is which. A heading over
     each would be a second way of saying the same thing, and the board is
     meant to read as a wall of notes rather than as a form.

     The 숙제 at the foot is deliberately NOT a note: it is a list of things to
     do, so it is set the way the to-do list in Time is set — a tick, a line of
     16px text, struck through when it is done and nothing else.
     ====================================================================== */
  .board-stack{display:flex; flex-direction:column; gap:var(--sp-3);}
  /* Notes of one tier stand side by side and drop to the next line when the
     row runs out, which is how they behave on a wall. Centred, so a single
     note is in the middle rather than stranded at the left. */
  .pi-row{
    display:flex; flex-wrap:wrap; justify-content:center;
    align-items:flex-start;
    gap:var(--sp-3);
  }
  /* The way to add one more note of the tier above. On the right, where every
     other control in these apps that acts on the block above it sits. */
  .add-row{display:flex; justify-content:flex-end;}
  /* The same mark, in the same 24px box, as every + in the other two apps.
     No wording: nothing in this family of apps spells out "add". */
  .add-btn, .hw-add{
    width:24px; height:24px; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; border-radius:0;
    color:var(--ink); cursor:pointer; line-height:0;
  }
  .add-btn svg, .hw-add svg{width:16px; height:16px; fill:currentColor; display:block;}
  .add-btn:hover, .hw-add:hover{opacity:0.6;}

  /* A note. Square, like everything else in these three apps — the paper is
     suggested by the colour, not by a rounded corner or a shadow, neither of
     which exists anywhere in the design.
     A div, not a button: nothing may nest inside a button, and this has to be
     able to hold one later. */
  .pi{
    /* A note is a set size, not whatever the screen is wide. One name, so
       the whole board resizes from here. */
    --link-blue:#2519FF;
    width:var(--pi-w); flex:0 0 auto; text-align:center;
    /* Square at the smallest: the same measure down as across. A note with
       more on it grows downward from there, never narrower or wider. */
    min-height:var(--pi-w);
    /* A column so that what is written sits in the middle of the paper rather
       than at the top of it, with the slack falling evenly above and below. */
    display:flex; flex-direction:column; justify-content:center;
    border:none; border-radius:0;
    padding:var(--sp-4);
    background:var(--postit);
    cursor:pointer;
    font-family:var(--font-ui);
    /* Dark lettering even though the page is black: a note's paper is light,
       so what is written on it follows the note, not the page. */
    color:#111;
  }
  /* The lines inside a note are big or small, and it is the PAIR of sizes that
     steps down a tier at a time: both rungs move together, so the tiers read
     as sizes rather than as colours that happen to differ. */
  .pi-big{font-weight:500; line-height:1.2; display:block; white-space:pre-wrap; word-break:break-word;}
  .pi-small{font-weight:300; line-height:1.3; display:block; white-space:pre-wrap; word-break:break-word;}
  .pi-big + .pi-big, .pi-big + .pi-small, .pi-small + .pi-big, .pi-small + .pi-small{margin-top:var(--sp-2);}

  /* An open note: the paper stays, the words become the text they are made
     of, and the tools sit under them on the same paper. */
  .pi.editing{cursor:default;}
  .pi-edit{
    width:100%; flex:1 1 auto; min-height:120px;
    font-family:var(--font-ui); font-size:var(--fs-body); font-weight:400;
    line-height:1.3; text-align:center;
    color:#111; background:rgba(255,255,255,0.55);
    border:0.5px solid rgba(0,0,0,0.35); border-radius:0;
    padding:var(--sp-2); resize:vertical;
  }
  .pi-tools{
    display:flex; align-items:center; justify-content:center;
    gap:var(--sp-3); margin-top:var(--sp-3);
  }
  .pi-tools input[type=color]{
    width:26px; height:26px; flex:0 0 auto;
    padding:0; border:0.5px solid rgba(0,0,0,0.35); border-radius:0;
    background:none; cursor:pointer; -webkit-appearance:none; appearance:none;
  }
  .pi-tools input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
  .pi-tools input[type=color]::-webkit-color-swatch{border:none;}

  /* ---- the five colours in Options: a swatch and its name, one per row ---- */
  .color-line{display:flex; align-items:center; gap:var(--sp-4);}
  .color-line + .color-line{margin-top:var(--sp-2);}
  .color-line input[type=color]{
    width:26px; height:26px; flex:0 0 auto;
    padding:0; border:0.5px solid var(--line-b); border-radius:0;
    background:none; cursor:pointer; -webkit-appearance:none; appearance:none;
  }
  .color-line input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
  .color-line input[type=color]::-webkit-color-swatch{border:none;}
  .color-line span{font-family:var(--font-ui); font-size:var(--fs-label); color:var(--ink);}
  .pi-tool{
    font-family:var(--font-ui); font-size:var(--fs-label); font-weight:400;
    padding:2px var(--sp-2);
    background:none; color:#111;
    border:0.5px solid rgba(0,0,0,0.35); border-radius:0;
    cursor:pointer;
  }
  .pi-tool.done{font-weight:500;}

  .pi-1 .pi-big{font-size:var(--fs-display);}
  .pi-1 .pi-small{font-size:var(--fs-body);}
  .pi-2 .pi-big{font-size:var(--fs-lead);}
  .pi-2 .pi-small{font-size:var(--fs-label);}

  /* A category with nothing in it: one + in the middle, in that category's
     own paper colour, and no wording — the colour says which it is. */
  .start-row{
    display:flex; align-items:center; justify-content:center;
    padding:var(--sp-5) 0;
  }
  /* The way into the month as text, bottom left. */
  .board-foot{margin-top:var(--sp-6); text-align:right;}

  /* ---- a task's deadline ---- */
  /* Offered beside the task only while it is open for rewording. */
  .due-btn{
    flex:0 0 auto;
    font-family:var(--font-ui); font-size:11px; font-weight:500;
    letter-spacing:0.04em;
    padding:3px var(--sp-2);
    background:none; color:var(--text-muted);
    border:0.5px solid var(--line-b); border-radius:0;
    cursor:pointer;
  }
  .due-btn.on{color:var(--ink); border-color:var(--ink);}
  /* What is left behind once a date is set: small, after the wording. */
  .due-tag{
    flex:0 0 auto;
    font-family:var(--font-ui); font-size:11px; font-weight:500;
    color:var(--text-muted); margin-left:var(--sp-2);
  }
  .due-tag.over{color:var(--rust);}

  /* ---- the little month the deadline is picked from ---- */
  .due-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; margin-top:var(--sp-3);}
  .due-grid .due-dow{
    font-family:var(--font-ui); font-size:11px; font-weight:300;
    color:var(--text-muted); text-align:center; padding-bottom:2px;
  }
  .due-grid button{
    font-family:var(--font-ui); font-size:var(--fs-label); font-weight:400;
    aspect-ratio:1; padding:0;
    background:none; color:var(--ink);
    border:none; border-radius:0; cursor:pointer;
  }
  .due-grid button.off{visibility:hidden;}
  /* A chosen day is a disc, as every other day-mark in these apps is — a
     rust square is the one shape the design does not have. */
  .due-grid button.on{
    background:var(--rust); color:#FFFFFF;
    border-radius:50%;
  }
  .due-grid button.now{text-decoration:underline;}

  /* ---- 숙제, set as the to-do list in Time is set ---- */
  /* The homework is a list, not a wall: it reads from the left like the to-do
     list in Time, whatever the notes above it are doing. */
  .hw-block{margin-top:var(--sp-5); text-align:left;}
  /* The two of them are parted by space, not by a line. `.hw-who + .hw-who`
     used to carry that margin and never fired once: the two headings are not
     siblings — a list of rows and a + stand between them. The gap belongs to
     the group, which is why each one is now wrapped. */
  a{color:var(--link-blue);}
  .hw-group + .hw-group{margin-top:var(--sp-6);}
  .hw-who{
    font-family:var(--font-ui); font-size:var(--fs-label); font-weight:500;
    color:var(--ink);
    margin-bottom:var(--sp-1);
  }
  .todo-row{display:flex; align-items:center; gap:var(--sp-2); padding:0; min-height:32px;}
  .todo-check{
    width:24px; height:24px; flex:0 0 auto; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; border-radius:0;
    cursor:pointer; line-height:0; color:var(--ink);
  }
  .todo-box{width:16px; height:16px; border:1px solid var(--ink); display:block;}
  .todo-row.is-done .todo-box{background:var(--ink);}
  .todo-text{
    font-family:var(--font-ui);
    font-size:var(--fs-label); font-weight:400;
    line-height:26px; color:var(--ink);
    flex:1; min-width:0; overflow-wrap:anywhere;
    background:none; border:none; padding:0; text-align:left;
    cursor:pointer;
  }
  /* Struck through, not faded. Fading reads as "can't press this", which is
     what :disabled looks like everywhere else in all three apps. */
  .todo-row.is-done .todo-text{text-decoration:line-through;}
  .hw-row{display:flex; justify-content:flex-end;}
  /* Sized to the line it stands in, or the row would jump as it opens. */
  .todo-edit-input{
    flex:1; min-width:0;
    font-size:var(--fs-label); line-height:26px;
    padding:0 var(--sp-1);
  }
  .todo-edit-input.prose{line-height:1.45; padding:var(--sp-1);}

  /* ---- the colour swatch in the note editor, as Options draws it ---- */

  /* ======================================================================
     PANE 2 — the month
     ====================================================================== */
  /* ---- below the calendar: today, written out as a list ----
     Not a box. A box around it said "this is a thing" without saying what
     thing; the day simply reads downward, the way the rest of the app does. */
  /* The day stands on white paper while the month below it stays black. The
     four names are declared again here, the way the popup does it, so every
     rule inside simply follows: "ink" is black in this box and white outside
     it, and nothing has to restate a colour. */
  .today-list{
    --paper:#FFFFFF;
    --ink:#111111;
    --text-muted:#6B6B6B;
    --line-b:#9A9A9A;
    --link-blue:#2519FF;
    background:var(--paper); color:var(--ink);
    padding:var(--sp-5) var(--sp-4);
    margin-bottom:var(--gap-block);
    text-align:center;
  }
  /* Everything in the box reads up the middle. */
  .today-list .today-date,
  .today-list .today-line,
  .today-list .todo-row,
  .today-list .hw-row{justify-content:center;}
  /* Not flex:1 here: stretched to the full width, a line would sit left of
     centre with the challenge disc pushed out to the edge. Sized to its own
     wording, the disc and the words centre together. */
  .today-list .todo-text{flex:0 1 auto; text-align:center;}
  /* Prose needs the width of the paper, not the width of its own wording. */
  .today-list .diary-group .todo-row{width:100%;}
  .today-list .todo-edit-input.prose{flex:1 1 auto; text-align:center;}
  /* The errands are what the day is read for, so they are set a step up from
     everything else in the box. The diary and the deadlines stay small. */
  .today-list .hw-group:first-of-type .todo-text{
    font-size:var(--fs-body); line-height:1.35;
  }
  /* The day being written. A button, because pressing it comes back to
     today after another date has been chosen. */
  .today-date{
    display:flex; align-items:center; gap:var(--sp-3);
    font-family:var(--font-ui); font-size:var(--fs-label); font-weight:400;
    color:var(--text-muted);
    background:none; border:none; border-radius:0; padding:0;
    margin-bottom:var(--sp-3); cursor:pointer; text-align:left;
  }
  .back-today{
    font-size:11px; color:var(--rust);
    border:0.5px solid var(--rust); padding:1px var(--sp-2);
  }
  /* A deadline falling on this day. Worked out from the board, so it is not
     a line anyone can edit here. */
  /* Quieter than the day's own errands rather than louder: it is a date
     falling due, not something to be done here. */
  .due-sched{
    font-family:var(--font-ui); font-size:var(--fs-label); font-weight:400;
    color:var(--text-muted); padding:2px 0; overflow-wrap:anywhere;
  }
  .today-line{
    display:flex; align-items:center; gap:var(--sp-2);
    flex-wrap:wrap;
    padding:var(--sp-2) 0;
  }
  /* Still worn by the name buttons in Options, which are a choice of one. */
  .opt-btn{
    font-family:var(--font-ui); font-size:var(--fs-label); font-weight:400;
    padding:3px var(--sp-2);
    background:transparent; color:var(--ink);
    border:1px solid transparent; border-radius:0;
    cursor:pointer;
  }
  .opt-btn.selected{border-color:var(--ink);}

  /* ---- the day's three lines ----
     Name, colon, blank. The blanks line up because the names share a width,
     which is what makes the three read as one block rather than three. */
  .mark-group{display:block; max-width:300px; margin:0 auto; text-align:left;}
  .mark-row{display:flex; align-items:center; gap:var(--sp-2); padding:3px 0;}
  .mark-label{
    font-family:var(--font-ui); font-size:var(--fs-label); font-weight:400;
    color:var(--ink); width:104px; flex:0 0 auto;
  }
  .mark-colon{font-size:var(--fs-label); color:var(--text-muted);}
  /* The same box every other field in these apps is written in — but the
     width has to out-rank `input[type="text"]`, which carries width:100% and
     a higher specificity than a class on its own. Unqualified, this rule lost
     and the three boxes ran off the right edge of the paper. */
  .mark-row .mark-input{
    flex:1 1 auto; width:auto; min-width:0;
    font-size:var(--fs-label); line-height:24px;
    padding:0 var(--sp-2);
  }
  /* The diary sits in the same list as the rest of the day, only quieter: it
     is the day's aside, not an instruction. */
  /* pre-wrap, or the line breaks the diary was written with collapse into
     spaces: it is one piece of writing and it keeps the shape it was given. */
  .diary-group .todo-text{
    font-weight:300; color:var(--text-muted);
    white-space:pre-wrap; line-height:1.5;
  }
  .diary-group .todo-edit-input.prose{line-height:1.5; text-align:center;}
  /* Nothing names the three lists any more, so the space between them is
     what parts them — it has to be plainly bigger than the space between two
     lines of the same list, or they read as one. */
  .today-list .hw-group + .hw-group{margin-top:var(--sp-5);}
  .today-list .hw-row{margin-top:-4px;}
  /* The date heading, on paper now, needs a line under it rather than only
     space — it is a heading, not the first entry. */
  .today-list .today-date{width:100%; margin-bottom:var(--sp-4);}

  /* ---- the month grid ----
     Seven days and then a narrow eighth column, which is the week itself:
     past Sunday, where a week ends. */
  /* minmax(0,1fr), not 1fr: a plain 1fr will not shrink below the widest
     thing in the column, so one long errand set on a single line pulled its
     day wider and squeezed the rest of the week. With a floor of 0 the track
     keeps its share and the errand is the thing that gets cut. */
  .cal-grid{display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)) 24px; gap:4px;}
  .cal-dow{
    font-family:var(--font-ui); font-weight:300; font-size:var(--fs-label);
    text-align:center; color:var(--text-muted); padding-bottom:4px;
  }
  .cal-cell{
    /* A column that starts at the top. A button centres its content by
       default, so a day with three lines on it pushed its own date down and
       the week's dates stopped lining up with each other. */
    display:flex; flex-direction:column;
    align-items:flex-start; justify-content:flex-start;
    min-height:93px;
    border:none; border-radius:0;
    padding:4px 5px;
    background:transparent;
    text-align:left;
    font-family:var(--font-ui);
    cursor:pointer;
  }
  /* In a column a child is only as wide as its content, and the wording has
     to have the cell's width to be wrapped and cut against. Only the wording:
     the same rule on every child stretched the 4px diary dot into a bar. */
  .cal-cell > .cal-sched{width:100%;}
  .cal-cell.empty{background:none; cursor:default;}
  .cal-daynum{font-size:var(--fs-cell); color:var(--ink); display:block;}
  .cal-cell.weekend .cal-daynum{color:var(--text-muted);}
  /* The day being written, when it is not today: outlined rather than
     filled, so today's disc stays the one solid mark on the month. */
  .cal-cell.picked .cal-daynum{
    width:22px; height:22px; border-radius:50%;
    border:1px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    margin:-2px 0 2px -2px;
  }
  /* Today, the 22px rust disc the projects month already draws. A fixed size:
     a one-figure date and a two-figure date must draw the same circle. */
  .cal-cell.today .cal-daynum{
    width:22px; height:22px; border-radius:50%;
    background:var(--rust); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    margin:-2px 0 2px -2px;
  }
  /* Output, then input-or-exercise. Weekends have neither. */
  .cal-marks{display:flex; gap:2px; margin-top:2px;}
  /* Empty is an outline; filled is that mark's own colour, written on by the
     grid so the three can be told apart at a glance. */
  .cal-sq{width:8px; height:8px; border:0.5px solid var(--line-b); display:block;}
  /* The errands, written out in the cell. Small enough that two or three fit
     above the ticks, and clipped rather than wrapped forever — the cell says
     what is on, the day says the rest. */
  .cal-sched{
    /* Two lines, cut at the end of the second. `text-overflow` counts one
       line only, so the box model that can count lines is the one used here —
       prefixed, which is how every browser still spells it. */
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    font-size:var(--fs-cell); font-weight:400; line-height:1.3;
    color:var(--ink); margin-top:2px;
    overflow-wrap:anywhere;
  }
  /* The challenge keeps a line of its own, and keeps it to one. */
  .cal-sched.chal{-webkit-line-clamp:1; color:var(--rust);}
  /* A deadline rides in the two lines above rather than taking one, so it is
     inline — grey, to say it is not one of the day's own errands. */
  .cal-sched .due{color:var(--text-muted);}
  /* A line of diary was written on this day. The errands say themselves; this
     is the only thing left that needs a mark. */
  .cal-dot{
    width:4px; height:4px; border-radius:50%;
    background:var(--text-muted); display:block; margin-top:3px;
  }

  /* ---- the eighth column: the week's 쀼톡 ---- */
  .cal-week{
    /* Lined up with the dates rather than floating in the middle of the row.
       At 62px the difference hardly showed; at 93px the mark sat low enough
       to read as belonging to the week below it. */
    min-height:93px; padding:4px 0 0;
    display:flex; align-items:flex-start; justify-content:center;
    background:transparent; border:none; border-radius:0;
    color:var(--text-muted); cursor:pointer;
  }
  .cal-week svg{width:14px; height:14px; fill:currentColor; display:block;}
  .cal-week:hover{color:var(--ink);}
  /* REVIEW will not fit across a 24px column, so it runs down it. Nothing
     else in these apps is set sideways, which is rather the point: it marks
     the week rather than any one day in it. */
  /* 쀼톡 as it is read: the three parts with space between them and no
     headings — the gap says where one ends. */
  .talk-read{
    display:block; width:100%;
    background:none; border:none; border-radius:0; padding:0;
    text-align:left; cursor:pointer;
  }
  .talk-part{
    display:block;
    font-family:var(--font-ui); font-size:var(--fs-label); font-weight:400;
    line-height:1.5; color:var(--ink);
    overflow-wrap:anywhere;
  }
  .talk-part + .talk-part{margin-top:var(--sp-5);}

  .cal-week .mark{
    writing-mode:vertical-rl;
    font-size:9px; font-weight:500; letter-spacing:0.08em;
    color:var(--ink);
  }

  /* ======================================================================
     Modals — the same box all three apps use
     ====================================================================== */
  .modal-overlay{
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.45);
    z-index:1000;
    align-items:flex-start; justify-content:center;
    padding:20px; overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  /* The popup is white, as it is in the other two apps — the page went dark,
     the box did not. Rather than restating a colour on every rule inside it,
     the four names are simply declared again here: inside this box "ink" is
     black and "paper" is white, and everything in it follows without being
     told. The one thing that cannot follow is a hover built on rgba, which is
     overridden just below. */
  .modal-box{
    --paper:#FFFFFF;
    --link-blue:#2519FF;
    --ink:#111111;
    --text-dark:#111111;
    --text-muted:#6B6B6B;
    position:relative; background:var(--paper); color:var(--ink);
    border:0.5px solid var(--line-b); border-radius:0;
    max-width:360px; width:100%; margin:auto;
    padding:var(--sp-5); box-sizing:border-box;
  }
  .modal-box .btn-primary:hover, .modal-box .btn-ghost:hover{background:rgba(0,0,0,0.05);}
  .modal-close{
    position:absolute; top:var(--sp-3); right:var(--sp-3);
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none;
    font-size:var(--fs-body); line-height:1; color:var(--ink); cursor:pointer; padding:0;
  }
  .modal-title{
    font-family:var(--font-ui); font-size:var(--fs-body); font-weight:500;
    color:var(--ink); margin:0 0 var(--sp-4); padding-right:28px;
  }
  /* How Options is divided in the other two apps: no box around a section,
     no rule between them — the line is off and only the space it held is
     kept. Nothing here is full-bleed, because there is no line to bleed. */
  .divider-bleed{height:1px; background:transparent; margin:30px 0 18px;}
  .card-panel{
    background:transparent; border:none; box-shadow:none;
    border-radius:0; padding:22px 0;
    position:relative;
  }
  .panel-inner{position:relative;}

  /* ---- the filter above the data editor ---- */
  .filter-row{display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap;}
  /* The two dates and their dash move as one, or the dash is left stranded
     beside the first box when the row wraps. */
  .date-pair{display:flex; align-items:center; gap:var(--sp-2);}
  .filter-row input[type="date"]{
    width:auto; flex:0 1 auto;
    font-size:var(--fs-label);
    padding:var(--sp-1) var(--sp-2);
  }
  /* A tick, drawn the way the to-do list draws one, so a box is a box
     everywhere in these apps. */
  .chk{
    display:flex; align-items:center; gap:var(--sp-2);
    font-family:var(--font-ui); font-size:var(--fs-label); font-weight:400;
    background:none; border:none; border-radius:0; padding:0;
    color:var(--text-muted); cursor:pointer;
  }
  .chk-box{
    width:16px; height:16px; flex:0 0 auto;
    border:1px solid var(--line-b); display:block;
  }
  .chk.on{color:var(--ink);}
  .chk.on .chk-box{background:var(--ink); border-color:var(--ink);}

<script>
/* =========================================================================
   BBYU — the board and the month, for two people.

   WHY THE KEYS ARE SPLIT THE WAY THEY ARE

   The other two apps store one JSON blob per key, and their conflict guard was
   written for one person on two devices. Two people writing at once is a
   different problem: whoever saves last wins the whole blob, so a tick made on
   one phone can wipe a tick made on the other a second earlier.

   The day was once two records, one per person, for exactly that reason. It
   is one record again: the two of them asked for the ticks not to be told
   apart, and a tick nobody owns cannot be owned by the wrong person either.
   `bbyu-daily-a` and `bbyu-daily-b` are still read once, so days ticked under
   the old shape are not lost, but nothing writes them any more.

   What is written together — the board, the day, the week's 쀼톡 — is written
   while the two of them are sitting down doing the review, which is the one
   time simultaneous edits are least likely.
   ========================================================================= */

/* ---- storage ----------------------------------------------------------
   Lifted unchanged from index.html: local first, then the server, with a mark
   on anything the server did not take and a retry when the connection comes
   back. The ONE change is the name of the key the sync code is kept under, so
   this app travels on a code of its own and sharing it with one other person
   does not hand over the vocabulary and time data as well. */
const SUPABASE_URL = 'https://nwjrjptiugewhmxixxix.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53anJqcHRpdWdld2hteGl4eGl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTg2MDIsImV4cCI6MjEwMDM5NDYwMn0.Un6oOpn3iKeMXssTNQmOszHiYxaKFxamTp_oPDaZ42I';
const SYNC_ID_KEY = 'bbyu-sync-id';   // its own code: this app is shared with one other person

function getSyncId(){
  let id = null;
  try{ id = localStorage.getItem(SYNC_ID_KEY); }catch(e){}
  if(!id){
    id = 'u_' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    try{ localStorage.setItem(SYNC_ID_KEY, id); }catch(e){}
  }
  return id;
}
function setSyncId(id){
  try{ localStorage.setItem(SYNC_ID_KEY, String(id).trim()); }catch(e){}
}

/* A read gives up after this long. Without it a request that never answers —
   not refused, just silent — leaves the whole load pending for ever. */
const CLOUD_TIMEOUT_MS = 8000;

async function cloudGet(key){
  const id = getSyncId() + ':' + key;
  const url = SUPABASE_URL + '/rest/v1/app_data?id=eq.' + encodeURIComponent(id) + '&select=payload';
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const bell = ctl ? setTimeout(() => ctl.abort(), CLOUD_TIMEOUT_MS) : null;
  let res;
  try{
    res = await fetch(url, {
      headers: {apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY},
      signal: ctl ? ctl.signal : undefined
    });
  } finally {
    if(bell) clearTimeout(bell);
  }
  if(!res.ok) throw new Error('cloud get ' + res.status);
  const rows = await res.json();
  if(!rows.length || rows[0].payload === null) return null;
  const p = rows[0].payload;
  // The column is jsonb, so what comes back is already parsed. The rest of the
  // app works with JSON strings, so put it back into that shape.
  return {value: typeof p === 'string' ? p : JSON.stringify(p)};
}

async function cloudSet(key, value){
  const id = getSyncId() + ':' + key;
  const url = SUPABASE_URL + '/rest/v1/app_data';
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates'
    },
    // value is a JSON string; parse it so it lands as real jsonb rather than a
    // string-wrapped blob. Anything unparseable is stored as-is.
    body: JSON.stringify({
      id,
      payload: (function(){ try{ return JSON.parse(value); }catch(e){ return value; } })(),
      updated_at: new Date().toISOString()
    })
  });
  if(!res.ok) throw new Error('cloud set ' + res.status);
  return {value};
}

const appStorage = (function(){
  const hasArtifactStorage = (typeof window !== 'undefined')
    && window.storage
    && typeof window.storage.get === 'function';

  if(hasArtifactStorage){
    return {
      kind: 'artifact',
      /* This host REJECTS a key that has never been written ("Key not found"),
         while everywhere else in the app a missing key is simply null. Left as
         it was, the very first read of a fresh month threw, and the throw took
         the whole load down with it. */
      get: (key, shared) => Promise.resolve(window.storage.get(key, shared)).catch(() => null),
      set: (key, value, shared) => window.storage.set(key, value, shared),
      // Nothing is queued on this host, so there is never anything unsent.
      unsentKeys: () => [],
      flushUnsent: () => Promise.resolve(0)
    };
  }

  const localGet = (key) => {
    const v = localStorage.getItem(key);
    // Matching window.storage: a missing key comes back null, and a present
    // one arrives wrapped as {value}.
    return v === null ? null : {value: v};
  };
  const localSet = (key, value) => {
    localStorage.setItem(key, value);
    return {value};
  };

  /* Work saved here that the server has not accepted. Without this mark the
     next start reads the server's older copy straight over the top of it and
     the work is gone with nothing said. */
  const dirtyKey = (key) => key + ':unsent';
  const stashKey = (key) => key + ':before-sync';
  const isDirty  = (key) => { try{ return localStorage.getItem(dirtyKey(key)) === '1'; }catch(e){ return false; } };
  const setDirty = (key, on) => {
    try{ on ? localStorage.setItem(dirtyKey(key), '1') : localStorage.removeItem(dirtyKey(key)); }catch(e){}
  };

  return {
    kind: 'cloud',
    async get(key){
      // Cloud is the source of truth across devices, but a network hiccup must
      // not look like "no data" — fall back to the local copy instead.
      try{
        const remote = await cloudGet(key);
        if(remote){
          const local = localGet(key);
          const differs = !local || local.value !== remote.value;

          if(differs && local && isDirty(key)){
            /* This device holds work the server never took, and the server
               holds something else. Dropping either one costs somebody a
               session, so neither is dropped: this device keeps its own, the
               server's copy is set aside under its own name, and the person is
               told now rather than discovering it weeks later. */
            try{ localSet(stashKey(key), remote.value); }catch(e){}
            syncConflicts.push(key);
            return local;
          }

          /* Taking the server's copy over the local one is normal and right,
             but the copy being replaced is kept for one round regardless. It
             costs a little room and it is the difference between a scare and a
             loss. */
          if(differs && local){
            try{ localSet(stashKey(key), local.value); }catch(e){}
          }
          try{ localSet(key, remote.value); }catch(e){}
          setDirty(key, false);
          return remote;
        }
        // Nothing in the cloud yet: adopt whatever this device already has so
        // existing local data survives the switch to syncing.
        const local = localGet(key);
        if(local){
          cloudSet(key, local.value).then(()=>setDirty(key, false)).catch(()=>{});
        }
        return local;
      }catch(e){
        console.warn('Cloud read failed, using local copy', e);
        cloudStatus(false);
        return localGet(key);
      }
    },
    async set(key, value){
      // Write locally first so the app never loses an edit to a dropped
      // connection, then push. A failed push is reported, not thrown, so the
      // user's work still lands on this device.
      let localOk = true;
      try{ localSet(key, value); }catch(e){ localOk = false; }
      // Marked before the attempt and cleared only once the server has it.
      setDirty(key, true);
      try{
        const r = await cloudSet(key, value);
        cloudStatus(true);
        setDirty(key, false);
        return r;
      }catch(e){
        console.warn('Cloud write failed, kept locally', e);
        cloudStatus(false);
        if(localOk) return {value};
        throw e;
      }
    },
    unsentKeys(){
      const out = [];
      try{
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          if(k && k.endsWith(':unsent') && localStorage.getItem(k) === '1'){
            out.push(k.replace(/:unsent$/, ''));
          }
        }
      }catch(e){}
      return out;
    },

    /* A mark left by a failed write was only ever cleared by saving that same
       thing again, so a minute without signal could leave the banner up for
       days while the work sat here unsent. This pushes every marked key once.
       One failure stops the run: if the server cannot be reached the rest will
       fail too, and the marks are the thing protecting the work. */
    async flushUnsent(){
      let sent = 0;
      for(const key of appStorage.unsentKeys()){
        const local = localGet(key);
        // Marked, but there is nothing here to send. The mark means nothing.
        if(!local){ setDirty(key, false); continue; }
        try{
          await cloudSet(key, local.value);
          setDirty(key, false);
          sent++;
        }catch(e){
          console.warn('Retry failed, mark kept', key, e);
          return sent;
        }
      }
      if(sent) cloudStatus(true);
      return sent;
    }
  };
})();

/* Keys where this device and the server disagreed at start-up. */
const syncConflicts = [];

/* Said plainly and once, at the top of the screen. The alternative is finding
   out that a session vanished some days later, when nothing can be done. */
function reportSyncTrouble(){
  const unsent = appStorage.unsentKeys ? appStorage.unsentKeys() : [];
  const bar = document.getElementById('cloudBanner');
  if(!bar) return;

  /* A preview pane is not the app. It keeps what is written in a sandbox of
     its own, nothing goes to the server from here, and the sandbox can come
     back empty the next time it opens — which is how an evening's writing
     disappeared once. Said at the top, in the loudest place there is, and it
     never goes away while the app is running there. */
  if(appStorage.kind === 'artifact'){
    bar.style.display = '';
    bar.textContent = '미리보기 창입니다. 여기에 쓴 것은 서버로 가지 않고, ' +
      '창을 닫으면 사라질 수 있습니다. 배포한 주소에서 쓰세요.';
    return;
  }
  // Runs again after a retry, so it has to be able to take the mark DOWN too.
  if(!syncConflicts.length && !unsent.length){ bar.style.display = 'none'; return; }
  bar.style.display = '';
  bar.textContent = syncConflicts.length
    ? 'This device had work the server never received, and the server had something different. ' +
      'What you are looking at is this device\'s copy. Take a backup now, then open the other device and check it.'
    : 'Some work has not reached the server yet. Stay on this device until the mark at the top clears, ' +
      'or take a backup before opening another one.';
}

/* At start-up, and again whenever the connection comes back. Without the second
   one the banner stays up until something is saved by hand, which reads as
   "still broken" long after it has been fixed. */
function retryUnsent(){
  if(!appStorage.flushUnsent) return;
  appStorage.flushUnsent().then(n => { if(n) reportSyncTrouble(); }).catch(()=>{});
}
window.addEventListener('online', retryUnsent);

// Shows a small banner when the device is working offline, so a long stretch of
// unsynced edits can't go unnoticed.
let cloudOnline = true;
function cloudStatus(ok){
  if(ok === cloudOnline) return;
  cloudOnline = ok;
  const el = document.getElementById('cloudBanner');
  if(el) el.style.display = ok ? 'none' : 'block';
}

/* ---- keys ------------------------------------------------------------- */
const K_BOARD  = 'bbyu-board';    // shared: the month's notes
const K_SHARED = 'bbyu-shared';   // the day: errands, ticks, diary, challenges
const K_PEOPLE = 'bbyu-people';   // shared: the two names
const K_TALKS  = 'bbyu-talks';    // 쀼톡, one per week, keyed by its Monday
const K_COLORS = 'bbyu-colors';   // the five colours, by slot name
/* The two per-person day stores. Nothing writes to them any more — the ticks
   are no longer told apart by person — but they are still read once, so a
   day already ticked is not lost. */
const kDaily = who => 'bbyu-daily-' + who;
const ME_KEY = 'bbyu-me';         // local only: which of the two this device is

/* ---- state ------------------------------------------------------------
   A month is a list of notes in the order they were written. A note is a name
   in brackets, an optional colour, and lines that are either big or small:

     {id, name:'아젠다2', color:'00E5FF',
      lines:[{s:false, t:'인스타는 밤에만', done:false}, ...]}

   `name` is kept exactly as it was typed so the text round-trips; the tier —
   which decides the two font sizes — is read off it. */
let board  = {};                  // {'2610': [note, ...]}
let shared = {};                  // {'261025': {sched[], out, pm, diary[], chal[]}}
let talks  = {};                  // {'261026': {good[], better[], etc[]}} by Monday
let colors = {};                  // {'쀼훈':'F2FF00', ...}, falling back to the defaults
let people = {a:'령', b:'동'};   // the wife, then the husband — the 숙제 block uses the same two
let me = 'a';
let viewMonth = '';               // YYMM being looked at
let pane = 'board';

const WHO = ['a', 'b'];
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => String(d.getFullYear()).slice(2) + pad2(d.getMonth()+1) + pad2(d.getDate());
const ym  = d => String(d.getFullYear()).slice(2) + pad2(d.getMonth()+1);
const todayCode = () => ymd(new Date());
const thisMonth = () => ym(new Date());
const monthOf = code => String(code).slice(0, 4);
const uid = () => 'n_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* A date code back into a Date, for weekday and grid maths. */
function dateFromCode(code){
  const s = String(code);
  return new Date(2000 + parseInt(s.slice(0,2),10), parseInt(s.slice(2,4),10) - 1, parseInt(s.slice(4,6),10));
}
/* Monday first, like every other calendar in these two apps. */
const DOW = ['월','화','수','목','금','토','일'];
function dowIndex(d){ return (d.getDay() + 6) % 7; }

/* =========================================================================
   Loading and saving. Each key is read and written on its own, which is what
   keeps one person's writes off the other's data.
   ========================================================================= */
function parse(res, fallback){
  try{ return res ? JSON.parse(res.value) : fallback; }catch(e){ return fallback; }
}

/* One key failing must not take the others with it. `Promise.all` rejects on
   the first failure and throws away every value that did arrive — which is how
   a single unreadable key left the whole board blank until something else
   happened to redraw it. Each read gets a catch of its own. */
function safeGet(key){
  return Promise.resolve(appStorage.get(key)).catch(e => {
    console.warn('Could not read ' + key, e);
    return null;
  });
}

async function loadAll(){
  const [b, s, p, t, cl, da, db] = await Promise.all([
    safeGet(K_BOARD), safeGet(K_SHARED), safeGet(K_PEOPLE), safeGet(K_TALKS),
    safeGet(K_COLORS), safeGet(kDaily('a')), safeGet(kDaily('b'))
  ]);
  board  = parse(b, {});
  shared = parse(s, {});
  talks  = parse(t, {});
  colors = Object.assign({}, DEFAULT_COLORS, parse(cl, {}));
  people = Object.assign({a:'령', b:'동'}, parse(p, {}));
  migrateDays(parse(da, {}), parse(db, {}));
  try{ me = localStorage.getItem(ME_KEY) || 'a'; }catch(e){ me = 'a'; }
  if(WHO.indexOf(me) === -1) me = 'a';
}

/* The day used to be two records, one per person, each holding a morning tick
   and an evening choice. It is one record now and the two are no longer told
   apart, so a day either of them ticked counts as ticked. Read once, never
   written again — the old keys are left where they are rather than deleted,
   in case a backup from before this change is restored. */
function migrateDays(a, b){
  Object.keys(shared).forEach(code => { shared[code] = normDay(shared[code]); });
  [a, b].forEach(src => {
    Object.keys(src || {}).forEach(code => {
      const e = src[code] || {};
      if(!e.am && !e.pm) return;
      const s = normDay(shared[code]);
      if(e.am) s.out = s.out || 'O';
      if(e.pm === 'input'    && !s.inp) s.inp = 'O';
      if(e.pm === 'exercise' && !s.ex)  s.ex  = 'O';
      shared[code] = s;
    });
  });
}

/* Every shape this record has ever had, read into the one it has now. The old
   `note` was a single paragraph; the diary is a list, so it becomes its first
   line. `challenge` and `eatout` are gone and are simply dropped. */
function normDay(raw){
  const s = raw || {};
  const diary = Array.isArray(s.diary) ? s.diary.slice()
    : (String(s.note || '').trim() ? [String(s.note).trim()] : []);
  /* The three were a tick and a choice between two; they are three written
     lines now, because what was done matters as much as that it was. A day
     ticked under the old shape keeps an O, which is all it ever said. */
  const txt = v => (typeof v === 'string') ? v : '';
  return {
    sched: Array.isArray(s.sched) ? s.sched.slice() : [],
    out:   typeof s.out === 'string' ? s.out : (s.out ? 'O' : ''),
    inp:   txt(s.inp) || (s.pm === 'input'    ? 'O' : ''),
    ex:    txt(s.ex)  || (s.pm === 'exercise' ? 'O' : ''),
    diary: diary,
    chal:  Array.isArray(s.chal) ? s.chal.slice() : []
  };
}

/* The three lines of the day, in the order they are asked about. The colour
   each one fills its square with lives in COLOR_SLOTS, which Options can
   change; it is looked up when the square is drawn rather than kept here. */
const DAY_MARKS = [
  {key: 'out', label: 'OutP (C.S.)'},
  {key: 'inp', label: 'InP'},
  {key: 'ex',  label: 'Ex.'}
];
const markDone = (s, k) => !!String(s[k] || '').trim();

const saveBoard  = () => appStorage.set(K_BOARD,  JSON.stringify(board));
const saveShared = () => appStorage.set(K_SHARED, JSON.stringify(shared));
const saveTalks  = () => appStorage.set(K_TALKS,  JSON.stringify(talks));
const saveColors = () => appStorage.set(K_COLORS, JSON.stringify(colors));
const savePeople = () => appStorage.set(K_PEOPLE, JSON.stringify(people));

/* Reading helpers that never write — a month or a day with nothing in it yet
   comes back as an empty shape rather than being created on sight. */
function notesOf(mm){ return Array.isArray(board[mm]) ? board[mm] : []; }
function sharedOf(code){ return normDay(shared[code]); }
/* A week is named by the Monday it starts on. */
function weekKey(code){
  const d = dateFromCode(code);
  return ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() - dowIndex(d)));
}
function talkOf(key){
  const t = talks[key] || {};
  return {
    good:   Array.isArray(t.good)   ? t.good.slice()   : [],
    better: Array.isArray(t.better) ? t.better.slice() : [],
    etc:    Array.isArray(t.etc)    ? t.etc.slice()    : []
  };
}
function talkEmpty(t){ return !t.good.length && !t.better.length && !t.etc.length; }

/* =========================================================================
   Panes
   ========================================================================= */
function setPane(p){
  pane = p;
  document.getElementById('paneBoard').style.display = (p === 'board') ? '' : 'none';
  document.getElementById('paneCal').style.display   = (p === 'cal')   ? '' : 'none';
  const dots = document.getElementById('paneDots').children;
  dots[0].classList.toggle('on', p === 'board');
  dots[1].classList.toggle('on', p === 'cal');
}

/* Options is a box over the board, not a pane of its own — so the month row
   never has to hide anything and there is always a way back out. */
function toggleOptions(){
  const ov = document.getElementById('optOverlay');
  if(ov.classList.contains('show')){ ov.classList.remove('show'); return; }
  renderOptions();
  ov.classList.add('show');
}

/* The board and the month are switched by pushing the screen sideways. There
   are only two, so either direction does the same thing — which is the whole
   reason there is no control for it. Lifted from Time, including the rule
   that a drag more vertical than horizontal is a scroll and not a swipe. */
(function(){
  const TRIGGER = 50;
  let x0 = 0, y0 = 0, live = false;
  const view = () => document.querySelector('.wrap');
  document.addEventListener('touchstart', e => {
    const v = view(), t = e.touches[0];
    live = !!(v && t && v.contains(e.target));
    if(live){ x0 = t.clientX; y0 = t.clientY; }
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    if(!live) return;
    const t = e.touches[0];
    if(!t) return;
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if(Math.abs(dy) > Math.abs(dx)){ live = false; return; }
    if(Math.abs(dx) > TRIGGER){
      setPane(pane === 'cal' ? 'board' : 'cal');
      live = false;
    }
  }, {passive:true});
  document.addEventListener('touchend', () => { live = false; }, {passive:true});

  /* The same push, made with a mouse. A machine with no touch screen had no
     way at all to reach the second screen, which is why the dots above exist
     as well — a drag cannot be seen, and nothing else said there was more
     than one screen.
     Only a mouse: a finger already fires the handlers above, and taking the
     pointer events too would switch twice on one swipe. */
  let mx = 0, my = 0, mlive = false;
  const typing = t => !!(t && (t.closest('input, textarea, .modal-overlay')));
  document.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'mouse' || e.button !== 0) return;
    const v = view();
    mlive = !!(v && v.contains(e.target)) && !typing(e.target);
    if(mlive){ mx = e.clientX; my = e.clientY; }
  });
  document.addEventListener('pointermove', e => {
    if(!mlive || e.pointerType !== 'mouse') return;
    const dx = e.clientX - mx, dy = e.clientY - my;
    if(Math.abs(dy) > Math.abs(dx)){ mlive = false; return; }
    if(Math.abs(dx) > TRIGGER){
      setPane(pane === 'cal' ? 'board' : 'cal');
      mlive = false;
    }
  });
  document.addEventListener('pointerup', () => { mlive = false; });
})();

function stepMonth(delta){
  const y = 2000 + parseInt(viewMonth.slice(0,2), 10);
  const m = parseInt(viewMonth.slice(2,4), 10) - 1;
  viewMonth = ym(new Date(y, m + delta, 1));
  renderAll();
}

function renderMonthLabel(){
  const y = 2000 + parseInt(viewMonth.slice(0,2), 10);
  const m = parseInt(viewMonth.slice(2,4), 10);
  document.getElementById('monthLabel').textContent = y + '. ' + m;
}

/* =========================================================================
   The board's text format.

     <쀼리뷰_10월>          written into the backup so a downloaded file says
                            which month it holds. Never shown in the app's own
                            editors — the month is already on screen there.
     [쀼훈]                 starts a note. The name decides the tier, and a
                            trailing number is only there to tell two notes of
                            the same tier apart: 쀼훈, 쀼훈2, 쀼훈3.
     (00E5FF)               that note's paper. Also backup-only: in the app the
                            colour is a swatch, the way Options sets the rating
                            colours in the Voca app.
     디톡스하자             a big line
     -인스타 넘 많이한다    a small line

   Inside [숙제] the same two marks mean something else, because it is a list
   of tasks rather than a note:

     령                     whose tasks follow
     -부동산 공부해서 보고  one task
     x-구렁이 금주 확인     one task, done

   Parsing is forgiving — a header or a colour line is read if it is there.
   Writing is not: each of the two serialisations below puts in exactly what
   its reader needs and nothing else.
   ========================================================================= */
const TIER_NAMES = {'쀼훈':1, '숙제':3};   // anything else is the middle tier
/* The categories the board always offers, top to bottom. A month missing one
   of these is offered a + for it rather than simply not having it. */
const TIER_ORDER = ['쀼훈', '아젠다', '크리에이티브 아젠다'];
const HW_NAME = '숙제';
/* The paper each kind of note starts on, so the three of them are told apart
   at a glance before anyone has picked a colour. Taken from the four the
   other two apps already use — the sample data was written on 00E5FF, which
   is one of them. A note given a colour of its own keeps it; 숙제 has no
   paper to colour. */
/* The five colours the app is set up with, and the names they are kept and
   written under. The first three are the paper a kind of note starts on; the
   last two are the day's marks in the grid, which borrow the first. All five
   can be changed in Options and all five travel with the data. */
const COLOR_SLOTS = [
  {key: '쀼훈',            label: '쀼훈',             def: 'F2FF00'},
  {key: '아젠다',          label: '아젠다',           def: '00E5FF'},
  {key: '크리에이티브 아젠다', label: '크리에이티브 아젠다', def: '2CE17A'},
  {key: 'OutP',           label: 'OutP (C.S.)',     def: 'F2FF00'},
  {key: 'InP',            label: 'InP',             def: '00E5FF'},
  {key: 'Ex.',            label: 'Ex.',             def: 'FF4602'}
];
const DEFAULT_COLORS = (() => {
  const o = {};
  COLOR_SLOTS.forEach(s => { o[s.key] = s.def; });
  return o;
})();
const hex6 = v => /^[0-9a-fA-F]{6}$/.test(String(v || '')) ? String(v).toUpperCase() : '';
function colorSlot(key){ return hex6(colors[key]) || DEFAULT_COLORS[key] || ''; }
function colorOf(note){ return note.color || colorSlot(baseName(note.name)) || ''; }
/* The square a day's mark is drawn as, one per line of the day. */
const markColor = key => colorSlot({out:'OutP', inp:'InP', ex:'Ex.'}[key]);
/* The two of them, in the order they are written. The husband is 동, the wife
   is 령; these are the only names the 숙제 block uses. */
const HW_WHO = ['령', '동'];

/* The + every one of these apps draws: two bars in a 24px box, no wording. */
const PLUS_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
  '<rect x="10.8" y="3" width="2.4" height="18"/>' +
  '<rect x="3" y="10.8" width="18" height="2.4"/></svg>';

/* The bracket name with its trailing number taken off, which is what says
   whether a note is the motto, an agenda or the task list. */
function baseName(name){ return String(name || '').replace(/\s*\d+\s*$/, '').trim(); }
function tierOf(name){ return TIER_NAMES[baseName(name)] || 2; }
function isHomework(name){ return baseName(name) === HW_NAME; }

/* One line of a note. The two marks may come in either order, so `x-...` and
   `-x...` both mean a small line that is done. An empty one — the `-` the
   blank form leaves waiting — is not a line at all. */
function parseLine(line){
  let t = line, done = false, small = false;
  for(let i = 0; i < 2; i++){
    if(/^[xX]/.test(t) && !done){ done = true; t = t.slice(1); continue; }
    if(t.charAt(0) === '-' && !small){ small = true; t = t.slice(1); continue; }
  }
  t = t.trim();
  /* A deadline is written on the end as @261103, so a line that goes out as
     text and comes back keeps the date it was given. */
  let due = '';
  const m = /\s*@(\d{6})\s*$/.exec(t);
  if(m){ due = m[1]; t = t.slice(0, m.index).trim(); }
  return t ? {s: small, t: t, done: done, due: due} : null;
}

function parseBoardText(text){
  const notes = [];
  let cur = null;
  String(text || '').split('\n').forEach(raw => {
    const line = raw.replace(/\r$/, '').trim();
    if(!line) return;
    if(/^<.*>$/.test(line)) return;                      // the month header
    const head = /^\[(.+?)\]$/.exec(line);
    if(head){
      cur = {id: uid(), name: head[1].trim(), color: '', lines: []};
      notes.push(cur);
      return;
    }
    if(!cur){                                            // lines before any [name]
      cur = {id: uid(), name: '아젠다', color: '', lines: []};
      notes.push(cur);
    }
    const col = /^\(#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\)$/.exec(line);
    if(col && !cur.lines.length){ cur.color = col[1].toLowerCase(); return; }
    const l = parseLine(line);
    if(l) cur.lines.push(l);
  });
  return notes;
}

/* One note's worth of lines and nothing else. The name and the colour are not
   in the box it is read from — the title says which note this is and the
   swatch sets the paper — so anything that looks like either is dropped
   rather than taken for content. */
function parseLines(text){
  const out = [];
  String(text || '').split('\n').forEach(raw => {
    const line = raw.replace(/\r$/, '').trim();
    if(!line) return;
    if(/^<.*>$/.test(line) || /^\[(.+?)\]$/.test(line)) return;
    if(/^\(#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\)$/.test(line)) return;
    const l = parseLine(line);
    if(l) out.push(l);
  });
  return out;
}

/* The four marks a line may carry. Escaped first, so nothing in the text can
   introduce markup of its own, and only then are the patterns put back as
   tags. A link is only made when it points somewhere a browser should follow;
   anything else is left as the plain text it was. */
/* The same wording with its marks taken off, for the places too small to
   draw them — a calendar cell shows `**장보기**` as 장보기, not as six extra
   characters of punctuation it has no room for. */
function stripMd(raw){
  return String(raw == null ? '' : raw)
    .replace(RE_LINK, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/__([^_]+)__/g, '$1')
    .replace(RE_U1, '$1$2')
    .replace(/~~([^~]+)~~/g, '$1');
}

/* One underscore on each side also underlines, because that is what gets
   typed — but only against a space or a bracket, so `snake_case` is left as
   it was written. */
const RE_LINK = /\[([^\]]+)\]\(([^)\s]+)\)/g;
const RE_U1   = /(^|[\s(\[])_([^_\n]+)_(?=$|[\s).,!?\]])/g;

function mdEmphasis(s){
  return s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_]+)__/g, '<u>$1</u>')
    .replace(RE_U1, '$1<u>$2</u>')
    .replace(/~~([^~]+)~~/g, '<s>$1</s>');
}

function mdToHtml(raw){
  let s = escapeHtml(raw);
  /* The links come out first and go back in last. Left in place, the marks
     below ran over the addresses too: an underscore inside a URL turned into
     an <u> in the middle of the href and the link stopped working. */
  const links = [];
  s = s.replace(RE_LINK, (m, t, u) => {
    if(!/^(https?:|mailto:)/i.test(u)) return m;
    links.push({t: t, u: u});
    return '\u0000' + (links.length - 1) + '\u0000';
  });
  s = mdEmphasis(s);
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => {
    const l = links[+i];
    return '<a href="' + l.u + '" target="_blank" rel="noopener">' +
      mdEmphasis(l.t) + '</a>';
  });
}

function lineToText(l){
  return (l.done ? 'x' : '') + (l.s ? '-' : '') + l.t + (l.due ? ' @' + l.due : '');
}

/* How many days from today to that date — 0 is the day itself, and a date
   already past comes back negative. */
function daysUntil(code){
  const a = dateFromCode(todayCode()), b = dateFromCode(code);
  return Math.round((b - a) / 86400000);
}
function dueLabel(code){
  const n = daysUntil(code);
  return n === 0 ? 'D-day' : (n > 0 ? 'D-' + n : 'D+' + (-n));
}

/* Every task in the month that falls due on a given day, as the wording the
   calendar shows. Worked out when the day is drawn rather than written into
   the day's own record: a deadline that moves would otherwise leave the old
   day still claiming it. */
function duesOn(code){
  const out = [];
  Object.keys(board).forEach(mm => {
    notesOf(mm).forEach(note => {
      if(!isHomework(note.name)) return;
      note.lines.forEach(l => {
        if(l.s && l.due === code && !l.done) out.push(l.t + ' D-day');
      });
    });
  });
  return out;
}

/* What one note's editor shows: its lines. Nothing else is editable there. */
function linesToText(note){ return note.lines.map(lineToText).join('\n'); }

/* The whole month, where the names ARE the content: without them there would
   be no saying which lines belong to which note. */
function boardToEditText(mm){
  const ns = sortedNotes(mm);
  return ns.length
    ? ns.map(n => '[' + n.name + ']\n' + linesToText(n)).join('\n\n')
    : BLANK_FORM;
}

/* =========================================================================
   THE TEXT FORM

   One format for everything: what the month editor shows, what a backup
   holds, and what the data editor in Options reads and writes. A backup used
   to be four lines of JSON with a readable copy underneath — unreadable in a
   text editor, which is the one place a backup gets opened. There is only the
   readable form now, and it is what gets read back in.

   Blocks stack in kind order, not by date: every review first, then every
   쀼톡, then every day.

     <이름>            the two of them
     <쀼리뷰_26년 10월>  a month's board
     <쀼톡_261019>      a week, by the Monday it starts on
     <쀼일_261026>      one day
   ========================================================================= */
const RE_HEAD = /^<([^_>]+)(?:_(.+))?>$/;

/* The year is written out only to keep a file read in another year from
   guessing; `<쀼리뷰_10월>` is still understood, against the file's own date. */
function monthHead(mm){
  return '<쀼리뷰_' + mm.slice(0,2) + '년 ' + parseInt(mm.slice(2,4), 10) + '월>';
}
function parseMonthHead(arg, baseYY){
  const full = /^(\d{2})년\s*(\d{1,2})월$/.exec(arg);
  if(full) return full[1] + pad2(+full[2]);
  const bare = /^(\d{1,2})월$/.exec(arg);
  if(bare) return baseYY + pad2(+bare[1]);
  if(/^\d{4}$/.test(arg)) return arg;
  return null;
}

function noteToFullText(note){
  return '[' + note.name + ']\n' +
    (note.color ? '(' + note.color.toUpperCase() + ')\n' : '') +
    note.lines.map(lineToText).join('\n');
}
function boardToFullText(mm){
  /* Sorted, so the file reads top to bottom the way the board does. */
  return monthHead(mm) + '\n\n' +
    sortedNotes(mm).map(noteToFullText).join('\n\n');
}

function talkToFullText(key){
  return '<쀼톡_' + key + '>\n\n' + talkToText(talkOf(key));
}

/* A day, section by section, leaving out whatever is empty. */
const DAY_SECTIONS = [
  {key: 'sched', head: '스케줄'},
  {key: 'chal',  head: '도전'},
  {key: 'diary', head: '일기'}
];
function dayToFullText(code){
  const s = sharedOf(code);
  const parts = [];
  if(s.sched.length) parts.push('[스케줄]\n' + s.sched.join('\n'));
  if(DAY_MARKS.some(m => markDone(s, m.key))){
    /* A blank that was left blank keeps its line — the three read as a set —
       but without a space trailing off the end of it. */
    parts.push('[체크]\n' + DAY_MARKS.map(m =>
      (m.label + ': ' + s[m.key]).replace(/\s+$/, '')).join('\n'));
  }
  if(s.chal.length)  parts.push('[도전]\n' + s.chal.join('\n'));
  if(s.diary.length) parts.push('[일기]\n' + s.diary.join('\n'));
  return parts.length ? '<쀼일_' + code + '>\n\n' + parts.join('\n\n') : '';
}
function dayEmpty(code){ return !dayToFullText(code); }

/* The five colours, written at the head of the data so they travel with it
   and can be changed in the editor like anything else. */
function colorsToFullText(){
  return '<색>\n\n' + COLOR_SLOTS.map(s =>
    s.label + ': ' + colorSlot(s.key)).join('\n');
}
function parseColorText(body){
  const out = {};
  String(body || '').split('\n').forEach(raw => {
    const line = raw.trim();
    const at = line.indexOf(':');
    if(at === -1) return;
    const label = line.slice(0, at).trim();
    const hit = COLOR_SLOTS.find(s => s.label === label || s.key === label);
    const v = hex6(line.slice(at + 1).trim().replace('#', ''));
    if(hit && v) out[hit.key] = v;
  });
  return out;
}

function peopleToFullText(){
  return '<이름>\n\n' + (people.a || '령') + '\n' + (people.b || '동');
}

/* Everything, or the part of it a filter asks for. `want` names the kinds,
   `from`/`to` are day codes and may be empty. */
function allToFullText(want, from, to){
  const w = want || {review: true, talk: true, day: true};
  const inRange = code => (!from || code >= from) && (!to || code <= to);
  const blocks = [];

  if(w.review){
    Object.keys(board).filter(mm => notesOf(mm).length).sort()
      /* A month is in range if it OVERLAPS it — its last day is not before
         the start and its first is not after the end. Testing the last day
         against both ends dropped October from 10/1–10/20. */
      .filter(mm => (!from || mm + '31' >= from) && (!to || mm + '01' <= to))
      .forEach(mm => blocks.push(boardToFullText(mm)));
  }
  if(w.talk){
    Object.keys(talks).filter(k => !talkEmpty(talkOf(k))).sort()
      .filter(inRange).forEach(k => blocks.push(talkToFullText(k)));
  }
  if(w.day){
    Object.keys(shared).filter(c => !dayEmpty(c)).sort()
      .filter(inRange).forEach(c => blocks.push(dayToFullText(c)));
  }
  return blocks.join('\n\n\n');
}

/* ---- reading it back ---------------------------------------------------
   Only the kinds present in the text are touched, and within a kind only the
   months, weeks and days it names: a file holding one month must not empty
   the other eleven.
   ----------------------------------------------------------------------- */
function parseAllText(text, baseYY){
  const yy = baseYY || todayCode().slice(0,2);
  const out = {colors: null, people: null, board: {}, talks: {}, shared: {}};
  let kind = null, arg = '', buf = [];

  const flush = () => {
    if(!kind) return;
    const body = buf.join('\n');
    if(kind === '색'){
      const c = parseColorText(body);
      if(Object.keys(c).length) out.colors = c;
    } else if(kind === '이름'){
      const names = body.split('\n').map(s => s.trim()).filter(Boolean);
      if(names.length) out.people = {a: names[0], b: names[1] || '동'};
    } else if(kind === '쀼리뷰'){
      const mm = parseMonthHead(arg, yy);
      if(mm) out.board[mm] = parseBoardText(body);
    } else if(kind === '쀼톡'){
      if(/^\d{6}$/.test(arg)) out.talks[arg] = parseTalkText(body);
    } else if(kind === '쀼일'){
      if(/^\d{6}$/.test(arg)) out.shared[arg] = parseDayText(body);
    }
    buf = [];
  };

  String(text || '').split('\n').forEach(raw => {
    const line = raw.replace(/\r$/, '').trim();
    const head = RE_HEAD.exec(line);
    if(head){ flush(); kind = head[1].trim(); arg = (head[2] || '').trim(); return; }
    if(kind) buf.push(raw.replace(/\r$/, ''));
  });
  flush();
  return out;
}

/* One day's sections back into the record. */
function parseDayText(body){
  const s = {sched: [], out: '', inp: '', ex: '', chal: [], diary: []};
  let sec = null;
  String(body || '').split('\n').forEach(raw => {
    const line = raw.trim();
    if(!line) return;
    const head = /^\[(.+?)\]$/.exec(line);
    if(head){
      const name = head[1].trim();
      sec = (name === '체크') ? 'marks'
          : (DAY_SECTIONS.find(x => x.head === name) || {}).key || null;
      return;
    }
    if(sec === 'marks'){
      const at = line.indexOf(':');
      if(at === -1) return;
      const label = line.slice(0, at).trim();
      const hit = DAY_MARKS.find(m => m.label === label || m.key === label);
      if(hit) s[hit.key] = line.slice(at + 1).trim();
      return;
    }
    if(sec) s[sec].push(line);
  });
  return s;
}

/* The form the review starts from when a month has nothing in it yet. */
const BLANK_FORM =
  '[쀼훈]\n\n' +
  '[아젠다]\n\n' +
  '[크리에이티브 아젠다]\n\n' +
  '[' + HW_NAME + ']\n' + HW_WHO[0] + '\n-\n' + HW_WHO[1] + '\n-';

/* =========================================================================
   PANE 1 — the board
   ========================================================================= */
/* Sorted so the top of the board is always the 쀼훈 and the foot the 숙제,
   whatever order they were written in. Within a tier the written order
   stands, which is what keeps 아젠다2 under 아젠다. */
/* Tier first, then the order each NAME first appeared, then the order within
   that name. Sorting on the raw index alone put a note added later at the end
   of its tier, which split 아젠다 and 아젠다2 around 크리에이티브 아젠다 and
   broke them into two rows. */
function sortedNotes(mm){
  const ns = notesOf(mm);
  const first = {};
  ns.forEach((n, i) => {
    const b = baseName(n.name);
    if(first[b] === undefined) first[b] = i;
  });
  return ns.slice()
    .map((n, i) => ({n: n, i: i}))
    .sort((a, b) =>
      (tierOf(a.n.name) - tierOf(b.n.name)) ||
      (first[baseName(a.n.name)] - first[baseName(b.n.name)]) ||
      (a.i - b.i))
    .map(x => x.n);
}

/* The name a new note of this tier should take: the first is bare, the rest
   carry the next free number. */
function nextName(mm, base){
  let max = 0;
  notesOf(mm).forEach(n => {
    if(baseName(n.name) !== base) return;
    const m = /(\d+)\s*$/.exec(n.name);
    max = Math.max(max, m ? parseInt(m[1], 10) : 1);
  });
  return max ? base + (max + 1) : base;
}

function noteBodyHtml(note){
  return note.lines.map(l =>
    '<span class="' + (l.s ? 'pi-small' : 'pi-big') + '">' + mdToHtml(l.t) + '</span>'
  ).join('');
}

/* The 숙제 note drawn as a list: a heading per person, then that person's
   lines. A bare line names whoever the lines under it belong to; anything
   before the first bare line belongs to no one and is shown first. */
/* `note` may be null: that is the month with no homework written yet, and it
   draws as the two names with a + under each. */
function homeworkHtml(note){
  const id = note ? note.id : '';
  const groups = [];
  if(!note){
    HW_WHO.forEach(w => groups.push({who: w, items: []}));
  } else {
    let cur = {who: '', items: []};
    groups.push(cur);
    note.lines.forEach((l, i) => {
      if(!l.s){ cur = {who: l.t, items: []}; groups.push(cur); return; }
      cur.items.push({l: l, i: i});
    });
  }
  return '<div class="hw-block">' + groups.map(g => {
    if(!g.who && !g.items.length) return '';
    return '<div class="hw-group">' +
      (g.who ? '<div class="hw-who">' + escapeHtml(g.who) + '</div>' : '') +
      g.items.map(it =>
        '<div class="todo-row' + (it.l.done ? ' is-done' : '') + '">' +
          '<button class="todo-check" aria-label="done"' +
            ' onclick="toggleLine(\'' + id + '\',' + it.i + ')">' +
            '<span class="todo-box"></span></button>' +
          (hwEditKey === id + '|' + it.i
            ? '<input type="text" class="todo-edit-input" value="' + escapeAttr(it.l.t) + '"' +
                ' onkeydown="hwRenameKey(event,\'' + id + '\',' + it.i + ')"' +
                ' onblur="hwRenameCommit(this,\'' + id + '\',' + it.i + ')"' +
                ' aria-label="고쳐 쓰기">' +
              /* Offered only while the task is open for rewording — a row of
                 DEADLINE boxes down a finished list would be all anyone saw. */
              '<button class="due-btn' + (it.l.due ? ' on' : '') + '"' +
                ' onmousedown="event.preventDefault();"' +
                ' onclick="openDuePicker(\'' + id + '\',' + it.i + ')">DEADLINE</button>'
            : '<button class="todo-text" onclick="hwStartEdit(\'' + id + '\',' + it.i + ')">' +
                mdToHtml(it.l.t) + '</button>' +
              (it.l.due ? '<span class="due-tag' +
                (daysUntil(it.l.due) < 0 ? ' over' : '') + '">' +
                dueLabel(it.l.due) + '</span>' : '')) +
        '</div>').join('') +
      '<div class="hw-row"><button class="hw-add" aria-label="추가"' +
        ' onclick="addHomework(\'' + id + '\',' +
        JSON.stringify(g.who).replace(/"/g, '&quot;') + ')">' + PLUS_SVG + '</button></div>' +
    '</div>';
  }).join('') + '</div>';
}

/* One note: what is written on it, or — while it is open — the text itself
   with its colour and a way to take it away. */
function pinHtml(note){
  const paper = colorOf(note);
  const bg = paper ? ' style="background:#' + escapeAttr(paper) + ';"' : '';
  if(noteEditId !== note.id){
    return '<div class="pi pi-' + tierOf(note.name) + '" role="button" tabindex="0"' + bg +
      ' onclick="openNote(\'' + note.id + '\')">' + noteBodyHtml(note) + '</div>';
  }
  return '<div class="pi pi-' + tierOf(note.name) + ' editing"' + bg + '>' +
    '<textarea class="pi-edit" spellcheck="false"' +
      ' oninput="noteTyping(this,\'' + note.id + '\')"' +
      ' onkeydown="noteEditKey(event)"' +
      ' aria-label="' + escapeAttr(note.name) + '">' +
      escapeHtml(linesToText(note)) + '</textarea>' +
    '<div class="pi-tools">' +
      '<input type="color" value="#' + escapeAttr(paper || 'EDEDED') + '"' +
        ' oninput="noteColorPick(this,\'' + note.id + '\')" aria-label="색">' +
      '<button class="pi-tool" onclick="deleteNoteNow(this,\'' + note.id + '\')">삭제</button>' +
      '<button class="pi-tool done" onclick="closeNote()" aria-label="완료">✓</button>' +
    '</div>' +
  '</div>';
}

function renderBoard(){
  const mm = viewMonth;
  const notes = sortedNotes(mm);
  const stack = document.getElementById('boardStack');

  /* A category with nothing in it had no + of its own, because the + belonged
     to a row of notes and there was no row — so a month that was missing the
     creative agenda could never be given one. Each missing category now gets
     a + of its own, in the middle and in that category's own paper colour, so
     an empty month opens with one + per category rather than a single one
     that writes the whole month at once. */
  const missing = base => !notes.some(n => baseName(n.name) === base);
  const startBtn = base =>
    '<div class="start-row"><button class="add-btn" aria-label="추가"' +
      ' style="color:#' + escapeAttr(colorSlot(base)) + ';"' +
      ' onclick="addNote(' + JSON.stringify(base).replace(/"/g, '&quot;') + ')">' +
      PLUS_SVG + '</button></div>';

  /* Notes of one name go into one row, which is what lets 쀼훈 and 쀼훈2 stand
     side by side; the + that adds one more follows that row. The homework is
     not a note and gets neither. */
  let html = '', open = false;
  const closeRow = base => {
    if(!open) return;
    html += '</div><div class="add-row"><button class="add-btn" aria-label="추가"' +
      ' onclick="addNote(' + JSON.stringify(base).replace(/"/g, '&quot;') + ')">' +
      PLUS_SVG + '</button></div>';
    open = false;
  };

  /* Walked in tier order, so a missing category's + stands where its notes
     would have stood rather than being swept to the end. */
  let at = 0;
  TIER_ORDER.forEach(base => {
    if(missing(base)){ closeRow(''); html += startBtn(base); return; }
    while(at < notes.length && baseName(notes[at].name) === base){
      const note = notes[at++];
      if(!open){ html += '<div class="pi-row">'; open = true; }
      html += pinHtml(note);
    }
    closeRow(base);
  });

  /* Whatever is left: the homework, and any name invented by hand. */
  while(at < notes.length){
    const note = notes[at++];
    const base = baseName(note.name);
    if(isHomework(note.name)){ closeRow(''); html += homeworkHtml(note); continue; }
    const prev = notes[at - 2];
    if(prev && baseName(prev.name) !== base) closeRow(baseName(prev.name));
    if(!open){ html += '<div class="pi-row">'; open = true; }
    html += pinHtml(note);
  }
  const last = notes[notes.length - 1];
  if(last) closeRow(baseName(last.name));

  /* The homework stands whether or not anything has been written in it. With
     no note there was no block, and with no block there was no + — the only
     way to start one was the text editor, which is not a way anyone should
